/* ============================================================
   LA CONSTRUCTION — « tu reçois les opérations, tu construis les
   états, l'app corrige ».
   C'est la promesse écrite du niveau 2 (aide:"partielle", notions
   n°1 et n°2) et elle n'était implémentée nulle part : les dix cas
   du niveau étaient des QCM où le setup SERVAIT les composants.
   Ici il n'y a rien à cocher. Il y a des cases, et un corrigé
   ligne par ligne qui dit le bon chiffre ET le raisonnement.
   ============================================================ */
let BUILDST=null;
/* Il tape comme il parle : « 12 500 », « 12500 € », « 12.500 », « -1 200,50 ».
   Le point sépare les milliers quand il est suivi d'exactement 3 chiffres
   et qu'aucune virgule n'apparaît ; sinon c'est un séparateur décimal. */
function bldNum(raw){
  let t=String(raw==null?"":raw).replace(/[\s\u00a0\u202f€]/g,"").trim();
  if(!t) return null;
  const neg=/^[-−]/.test(t); t=t.replace(/^[-−+]/,"");
  if(t.indexOf(",")>=0) t=t.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(t)) t=t.replace(/\./g,"");
  const v=parseFloat(t);
  if(!isFinite(v)) return null;
  return neg?-v:v;
}
function bldTol(l){
  if(l.tol!==undefined) return l.tol;
  return Math.max(40, Math.abs(l.val)*0.02);   /* 2 %, plancher 40 € : on juge la méthode, pas l'arrondi */
}
function bizOpenBuild(c){
  const B=S.biz;
  NEGOACTIVE=null;
  const lines=c.lines(B);
  BUILDST={id:c.id, lines, done:false};
  openOv(ovTop(c.title)+`
    <div class="meta"><span class="tag">${c.icon} ${c.concept}</span>mois ${B.month}</div>
    ${sigBlock(c)}
    <div class="story"><p>${c.setup(B)}</p></div>
    <h2 class="sec">${c.tableTitle||"À toi de construire"}</h2>
    <div class="xptxt" style="margin-bottom:8px">${c.intro||"Un montant par case, en euros. Les espaces, le € et les séparateurs de milliers sont acceptés. Une case vide compte comme fausse."}</div>
    <div class="bld" id="bldT">
      ${lines.map((l,i)=>`<div class="bldr" id="bldr${i}">
        <div class="lb">${l.label}${l.hint?`<small>${l.hint}</small>`:""}</div>
        <input id="bld${i}" inputmode="decimal" placeholder="${l.unit||"€"}"
          onkeydown="if(event.key==='Enter'){event.preventDefault();bldFocus(${i+1});}">
        <div class="vd" id="bldv${i}"></div>
      </div>`).join("")}
    </div>
    ${calcBlock()}
    ${formBlock()}
    <div class="coach">Aucune de ces lignes ne t'est donnée ailleurs dans l'app. Si tu bloques, <b>pose le calcul sur papier</b> : c'est la compétence, pas le résultat.</div>
    <button class="btn" id="bldGo" onclick="bldCheck('${c.id}')">Corriger ma copie</button>
    <div id="bldOut"></div>`);
}
function bldFocus(i){ const e=document.getElementById("bld"+i); if(e) e.focus(); }
function bldCheck(cid){
  const B=S.biz, c=bizCase(cid);
  if(!BUILDST||BUILDST.done) return;
  const lines=BUILDST.lines;
  let bons=0; const detail=[];
  lines.forEach((l,i)=>{
    const brut=(document.getElementById("bld"+i)||{}).value||"";
    const v=bldNum(brut);
    const ok = v!==null && Math.abs(v-l.val)<=bldTol(l);
    if(ok) bons++;
    detail.push({k:l.k,label:l.label,saisi:v,val:l.val,ok});
    const row=document.getElementById("bldr"+i);
    if(row){ row.classList.add(ok?"ok":"ko"); }
    const inp=document.getElementById("bld"+i); if(inp) inp.disabled=true;
    const vd=document.getElementById("bldv"+i); if(vd) vd.textContent=ok?"✓":"✗";
  });
  BUILDST.done=true;
  const go=document.getElementById("bldGo"); if(go) go.remove();
  /* Le corrigé : pour CHAQUE ligne, le bon chiffre et le raisonnement.
     Y compris sur les lignes justes — il a pu tomber juste par hasard. */
  const corr=lines.map((l,i)=>{
    const d=detail[i];
    return `<div class="bldfix">${d.ok?"✓":"✗"} <b>${l.label}</b> — le bon chiffre est
      <span class="rg">${l.unit==="j"?Math.round(l.val)+" j":l.unit==="×"?l.val.toFixed(2)+" ×":eur(l.val)}</span>${
        d.saisi===null?" (tu n'as rien mis)":(!d.ok?` (tu as mis ${l.unit==="j"?Math.round(d.saisi)+" j":l.unit==="×"?d.saisi.toFixed(2)+" ×":eur(Math.round(d.saisi))})`:"")}
      <br>${l.how}${l.trap?`<br><b style="color:var(--acc)">Le piège :</b> ${l.trap}`:""}</div>`;
  }).join("");
  const q = bons===lines.length?2 : bons>=lines.length*.75?1 : bons>=lines.length*.5?0 : bons>=lines.length*.25?-1 : -2;
  document.getElementById("bldOut").innerHTML=`
    <div class="bldtot"><span>Ta copie</span><span style="color:${bons===lines.length?"var(--ok)":bons>=lines.length*.5?"var(--txt)":"var(--bad)"}">${bons} / ${lines.length}</span></div>
    ${corr}
    <button class="btn" onclick="bldDone('${cid}')">Voir ce que ça t'apprend</button>`;
  document.getElementById("bldOut").scrollIntoView({behavior:"smooth",block:"start"});
  BUILDST.res={bons,total:lines.length,detail,q};
}
function bldDone(cid){
  const B=S.biz, c=bizCase(cid), r=BUILDST?BUILDST.res:null;
  if(!r) return;
  const arg=r.detail.map(d=>`${d.label} : ${d.saisi===null?"—":Math.round(d.saisi)}${d.ok?" ✓":" ✗ (attendu "+Math.round(d.val)+")"}`).join("\n");
  B.answers.push({id:cid,k:String(r.bons)+"/"+String(r.total),arg,month:B.month,q:r.q,label:r.bons+" / "+r.total+" lignes justes"});
  if(c.apply) c.apply(B,r);
  bizRebalance();
  B.seen.push(cid); B.pending=null;
  addXP(8+r.bons*3);
  if(r.bons===r.total){ const J=jx(B); J.etatParfait=true; J.etatsParfaits=(J.etatsParfaits||0)+1; }
  jalonCheck(B);
  save();
  BUILDST=null;
  bizDebrief(c, String(r.bons), r.bons+" / "+r.total+" lignes justes", c.debrief(B,r));
}

let NEGOPICK=[];
function bizOpenNego(c){
  const B=S.biz; NEGOPICK=[]; NEGOACTIVE=c.id;
  openOv(ovTop(c.title)+`
    <div class="meta"><span class="tag">${c.icon} ${c.concept}</span>mois ${B.month}</div>
    ${sigBlock(c)}

}
function negoTog(cid,k){
  const c=bizCase(cid);
  const i=NEGOPICK.indexOf(k);
  if(i>=0) NEGOPICK.splice(i,1);
  else { if(NEGOPICK.length>=c.max) return toast("Trois arguments maximum. <b>Choisis.</b>"); NEGOPICK.push(k); }
  document.querySelectorAll(".ngL").forEach(e=>e.classList.toggle("on",NEGOPICK.includes(e.dataset.k)));
  bzArgSync();          /* le bouton suit les coches, pas seulement le texte */
}
function bizNegoGo(cid){
  const B=S.biz, c=bizCase(cid);
  if(!NEGOPICK.length) return toast("Aucun argument coché — <b>touche les lignes</b> de la liste, les écrire ne suffit pas.");
  const arg=(document.getElementById("bzArg").value||"").trim();
  const picks=NEGOPICK.slice();
  const r=c.resolve(B,picks);
  bizRebalance();     /* idem après une négociation : resolve() bouge le bilan */
  const q=Math.max(-2,Math.min(2,Math.round(r.p/2)));
  B.answers.push({id:cid,k:picks.join("+"),arg,month:B.month,q,label:picks.map(k=>c.levers.find(l=>l.k===k).label).join(" · ")});
  B.seen.push(cid); B.pending=null; addXP(14); save();
  const detail=`<h2 class="sec">Tes arguments, un par un</h2>`+picks.map(k=>{
    const l=c.levers.find(x=>x.k===k);
    return `<div class="pt" style="border-left:3px solid ${l.power>0?"var(--ok)":"var(--bad)"}">
      <b>${l.power>0?"✔︎":"✘"} ${l.label}</b><br><span style="color:var(--dim)">${l.why}</span></div>`;
  }).join("")+`<h2 class="sec">Ceux que tu n'as pas joués</h2>`+c.levers.filter(l=>!picks.includes(l.k)).map(l=>
      `<div class="pt" style="opacity:.72"><b>${l.power>0?"✔︎":"✘"} ${l.label}</b><br><span style="color:var(--dim)">${l.why}</span></div>`).join("");
  bizDebrief(c,picks.join("+"),c.goal,c.debrief(B,picks,r)+detail);
}
function bizDecide(cid,k){
  const B=S.biz, c=bizCase(cid);
  const arg=(document.getElementById("bzArg").value||"").trim();
  const opt=c.options.find(o=>o.k===k);
  B.answers.push({id:cid,k,arg,month:B.month,q:opt.q,label:labOf(opt,B)});
  c.apply(B,k);
  bizRebalance();     /* un cas peut sortir du cash sans actif en face : c'est une charge */
  B.seen.push(cid); B.pending=null;
  addXP(12); save();
  bizDebrief(c,k,labOf(opt,B),c.debrief(B,k));
}

/* ================================================================
   LES EXOS — l'échelle des calculs.
   Sa demande, mot pour mot : « je me suis rendu compte que je n'ai
   pas les bases […] tu me donnes les infos et je dois calculer
   d'abord marge nette EBITDA etc… puis le niveau progresse FCFF […]
   les bêtas […] mais ça tout à la fin, fais d'abord toujours
   toujours toujours commencer par fixer des bases solides. »
   D'où : douze paliers, VERROUILLÉS les uns derrière les autres. Le
   palier 1 est une soustraction. Les bêtas sont au 12 et ne sont pas
   atteignables avant d'avoir validé les onze autres.
   Les chiffres sont tirés à chaque série : on ne mémorise pas une
   réponse, on apprend un geste. ================================= */
const EXO_SERIE=3;        /* exercices par séance (chacun porte 2 à 4 questions) */
const EXO_SEUIL=.80;      /* pour valider un palier et ouvrir le suivant */
function exosSt(){ if(!S.exos) S.exos={cur:1,p:{}}; if(!S.exos.p) S.exos.p={}; if(!S.exos.cur) S.exos.cur=1; return S.exos; }
function exoPal(n){ return EXOS.find(p=>p.n===n); }
function exoEtat(n){ const st=exosSt(); return st.p[n]||{best:0,done:0,valide:false}; }
function exoOuvert(n){ return n===1 || exoEtat(n-1).valide; }
function exoRng(){
  /* Générateur simple : on veut du hasard à chaque série, pas de la
     reproductibilité — l'intérêt est justement que les chiffres changent. */
  return { ent:(a,b)=>a+Math.floor(Math.random()*(b-a+1)) };
}
function exoTol(q){
  if(q.tol!==undefined) return q.tol;
  if(q.unit==="%") return .2;
  if(q.unit==="×") return .05;
  if(q.unit==="j") return 1;
  if(q.unit==="€") return Math.max(100, Math.abs(q.val)*.01);
  return .05;
}
/* ⚠️ LES EXOS N'ABRÈGENT PAS LES MONTANTS.
   Bug remonté le 2026-09-21 : l'énoncé affichait « 267,0 k€ » et
   « 128,0 k€ », il a répondu 139 — calcul juste — et l'app a compté
   faux parce qu'elle attendait 139 000. On lit en milliers, on répond
   en euros : c'est l'app qui piégeait, pas lui.
   Dans un exercice de calcul, ce qui est LU doit être ce avec quoi on
   CALCULE. Les montants sont donc écrits en toutes lettres, avec des
   espaces de milliers, dans l'énoncé, dans les corrigés et dans la
   réponse attendue. eur() garde son abrégé partout ailleurs. */
function eurX(n){
  n=Math.round(n);
  const neg=n<0; n=Math.abs(n);
  return (neg?"−":"")+String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ")+" €";
}
function vfEuro(v){ return String(Math.round(v*100)/100).replace(".",",")+" €"; }

function exoFmt(v,u){
  if(u==="€u") return vfEuro(v);     /* prix unitaire : on garde les centimes */
  if(u==="€") return eurX(v);   /* jamais de k€ dans un exercice : lu = calculé */
  if(u==="%") return (Math.round(v*100)/100).toFixed(2).replace(".",",")+" %";
  if(u==="×") return (Math.round(v*100)/100).toFixed(2).replace(".",",")+" ×";
  if(u==="j") return Math.round(v)+" j";
  return String(Math.round(v*1000)/1000).replace(".",",");
}

/* ---------- l'échelle ---------- */
function exosRoom(){
  const st=exosSt();
  const lignes=EXOS.map(p=>{
    const e=exoEtat(p.n), ouvert=exoOuvert(p.n);
    const pc=e.best?Math.round(e.best*100):0;
    return `<div class="mod${e.valide?" gold":""}" ${ouvert?`onclick="exoPalRoom(${p.n})"`:``} style="${ouvert?"":"opacity:.45"}">
      <div class="ico">${ouvert?p.ic:"🔒"}</div>
      <div class="t"><b>${p.n}. ${esc(p.titre)}</b><small>${esc(p.sujet)}${e.done?` · meilleur score ${pc} %`:""}</small></div>
      <div class="pc">${e.valide?"✓":ouvert?"›":""}</div>
    </div>`;}).join("");
  const faits=EXOS.filter(p=>exoEtat(p.n).valide).length;
  openOv(ovTop("🧮 Les exos")+`
    <p class="sub">Je te donne les chiffres, tu calcules. Douze paliers, et <b>chacun ouvre le suivant</b> : on ne saute pas une marche. Le premier est une soustraction, le dernier désendette un bêta.</p>
    <div class="crit" style="margin:10px 0"><b>${faits}/12 paliers validés.</b> ${faits===0?"Commence par le 1. Même si tu crois le savoir — surtout si tu crois le savoir.":faits<12?"Le palier "+(faits+1)+" t'attend.":"Les douze sont tombés. Reprends-en un au hasard de temps en temps : ça se reperd."}</div>
    ${lignes}
    <div class="xptxt" style="margin-top:10px">Les chiffres changent à chaque série. Tu ne peux pas retenir une réponse — seulement apprendre le geste.</div>`);
}

/* ---------- la règle, avant de calculer ---------- */
function exoPalRoom(n){
  const p=exoPal(n), e=exoEtat(n);
  if(!p||!exoOuvert(n)) return;
  openOv(ovTop(p.ic+" "+p.titre)+`
    <div class="meta"><span class="tag">Palier ${n} / 12</span>${esc(p.sujet)}</div>
    <div class="card"><div class="lab" style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);font-weight:800;margin-bottom:8px">La règle</div>
      <div class="story"><p>${p.rappel}</p></div></div>
    ${e.done?`<div class="xptxt" style="margin:10px 0">Déjà travaillé ${e.done} fois · meilleur score <b>${Math.round(e.best*100)} %</b>${e.valide?" · <b style=\"color:var(--ok)\">validé</b>":""}</div>`:""}
    <button class="btn" onclick="exoStart(${n})">${e.done?"Refaire une série":"Commencer — "+EXO_SERIE+" exercices"}</button>
    <button class="btn ghost" onclick="exosRoom()">‹ L'échelle</button>`);
}

/* ---------- la séance ---------- */
let EXS=null;
function exoStart(n){
  const p=exoPal(n); if(!p) return;
  const R=exoRng(), ex=[];
  for(let i=0;i<EXO_SERIE;i++){ try{ ex.push(p.gen(R)); }catch(e){} }
  if(!ex.length) return toast("Impossible de générer la série.");
  EXS={n, p, ex, e:0, q:0, bons:0, total:ex.reduce((t,x)=>t+x.questions.length,0), answered:false, rates:[], acquis:[]};
  exoDraw();
}
function exoDraw(){
  if(!EXS) return;
  const {p,ex,e,q}=EXS, cur=ex[e], it=cur.questions[q];
  const faits=ex.slice(0,e).reduce((t,x)=>t+x.questions.length,0)+q;
  const don=cur.donnees.map(d=>`<div class="bldr" style="border-bottom:1px solid var(--line)">
      <div class="lb">${esc(d[0])}</div>
      <div style="font-weight:800;font-size:15px;white-space:nowrap">${exoFmt(d[1],d[2])}</div></div>`).join("");
  openOv(ovTop(p.ic+" "+p.titre)+`
    <div class="meta"><span class="tag">Palier ${p.n} · exercice ${e+1}/${ex.length}</span>question ${faits+1} / ${EXS.total}</div>
    ${cur.contexte?`<div class="xptxt" style="margin-bottom:8px">${cur.contexte}</div>`:""}
    <div class="bld">${don}</div>
    <div class="card"><h2 style="font-size:17px;line-height:1.4">${esc(it.q)}</h2></div>
    <div class="bldr" style="border:none;padding:12px 0">
      <div class="lb" style="flex:0 0 auto;color:var(--dim);font-size:12px">Ta réponse</div>
      <input id="exoIn" inputmode="decimal" placeholder="${it.unit||"nombre"}"
        onkeydown="if(event.key==='Enter'){event.preventDefault();exoCheck();}">
      <div style="flex:0 0 26px;color:var(--dim);font-weight:800">${it.unit||""}</div>
    </div>
    ${calcBlock()}
    <button class="btn" id="exoGo" onclick="exoCheck()">Vérifier</button>
    <div id="exoOut"></div>
    <button class="btn ghost mt" onclick="exoQuit()">Arrêter la série</button>`);
  setTimeout(()=>{ const i=document.getElementById("exoIn"); if(i) i.focus(); },120);
}
function exoCheck(){
  if(!EXS||EXS.answered) return;
  const it=EXS.ex[EXS.e].questions[EXS.q];
  const v=bldNum((document.getElementById("exoIn")||{}).value||"");
  const ok = v!==null && Math.abs(v-it.val)<=exoTol(it);
  EXS.answered=true;
  if(ok) EXS.bons++; else EXS.rates.push(it);
  const inp=document.getElementById("exoIn"); if(inp) inp.disabled=true;
  const go=document.getElementById("exoGo"); if(go) go.remove();
  const dernier = EXS.e===EXS.ex.length-1 && EXS.q===EXS.ex[EXS.e].questions.length-1;
  /* Le cas « bon calcul, mauvaise unité » : on ne le confond pas avec une
     erreur de raisonnement, on le NOMME. En finance l'ordre de grandeur
     compte, donc ça reste faux — mais il doit savoir que le geste était bon. */
  const unite = !ok && v!==null && it.unit==="€" && Math.abs(v*1000-it.val)<=Math.max(exoTol(it),Math.abs(it.val)*.01);
  /* Le résultat entre dans les suggestions de la calculatrice — la BONNE
     valeur, même s'il s'est trompé : la question suivante s'appuie dessus,
     et le faire repartir d'un chiffre faux en enchaînerait une deuxième. */
  if(!EXS.acquis) EXS.acquis=[];
  EXS.acquis.push({lab:exoLab(it.q), val:Math.round(it.val*1000)/1000});
  document.getElementById("exoOut").innerHTML=`
    <div class="expl ${ok?"ok":"no"}">${ok?"✅ Juste."
      : unite?"❌ <b>Ton calcul est juste</b> — c'est l'unité. Tu as répondu en milliers ; la réponse attendue est <b>"+exoFmt(it.val,it.unit)+"</b>. En finance, l'ordre de grandeur fait partie de la réponse."
      : "❌ La réponse est <b>"+exoFmt(it.val,it.unit)+"</b>"+(v===null?" (tu n'as rien écrit).":".")}</div>
    <div class="bldfix" style="padding:10px 0"><b>Le calcul :</b> ${it.calcul}</div>
    <div class="crit" style="margin:8px 0"><b>Ce qu'il faut retenir :</b> ${it.cle}</div>
    <button class="btn" onclick="exoNext()">${dernier?"Voir le résultat":"Question suivante"}</button>`;
  document.getElementById("exoOut").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function exoNext(){
  if(!EXS) return;
  const cur=EXS.ex[EXS.e];
  EXS.answered=false;
  if(EXS.q<cur.questions.length-1){ EXS.q++; return exoDraw(); }
  if(EXS.e<EXS.ex.length-1){ EXS.e++; EXS.q=0; EXS.acquis=[]; return exoDraw(); }
  exoFin();
}
function exoFin(){
  const {n,p,bons,total,rates}=EXS;
  const part=total?bons/total:0, valide=part>=EXO_SEUIL;
  const st=exosSt(), e=exoEtat(n);
  const avantValide=e.valide;
  st.p[n]={best:Math.max(e.best||0,part), done:(e.done||0)+1, valide:e.valide||valide};
  if(valide && !avantValide && n<12) st.cur=Math.max(st.cur,n+1);
  addXP(6+bons*3+(valide&&!avantValide?25:0));
  save();
  const suivant=exoPal(n+1);
  openOv(ovTop("Résultat")+`
    <div class="card" style="text-align:center;border-color:${valide?"var(--ok)":"var(--line)"}">
      <div style="font-size:42px">${part===1?"👑":valide?"✅":"🔁"}</div>
      <h2 style="font-size:26px;margin-top:6px">${bons} / ${total}</h2>
      <div class="sub mt">${part===1?"Sans une faute. Le palier est à toi."
        :valide?"Palier validé — il fallait 80 %."
        :"Il faut <b>80 %</b> pour valider. Tu y es presque, et refaire une série te donnera d'autres chiffres."}</div>
    </div>
    ${rates.length?`<div class="card"><div class="lab" style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--bad);font-weight:800;margin-bottom:8px">Ce qui a manqué</div>
      ${rates.map(r=>`<div class="bldfix" style="padding:8px 0"><b>${esc(r.q)}</b><br>${r.cle}</div>`).join("")}</div>`:""}
    ${valide&&!avantValide&&suivant?`<div class="crit" style="margin:10px 0">🔓 <b>Palier ${suivant.n} ouvert : ${esc(suivant.titre)}.</b> ${esc(suivant.sujet)}.</div>`:""}
    <button class="btn" onclick="exoStart(${n})">Refaire une série</button>
    ${valide&&suivant?`<button class="btn" onclick="exoPalRoom(${suivant.n})">Passer au palier ${suivant.n}</button>`:""}
    <button class="btn ghost" onclick="exosRoom()">‹ L'échelle</button>`);
  EXS=null;
}
function exoQuit(){ EXS=null; exosRoom(); }

}

function importSave(){
  const raw=prompt("Colle ici le JSON exporté :");
  if(!raw) return;
  try{ const s=JSON.parse(raw); if(typeof s.xp!=="number"||!s.done) throw 0;
    localStorage.setItem(KEY,raw); location.reload();
  }catch(e){ toast("❌ JSON invalide. Rien n'a été modifié."); }
}

const ov=document.getElementById("ov"),ovin=document.getElementById("ovin");
function openOv(html){ ovin.innerHTML=html; ov.classList.add("on"); ov.scrollTop=0; }
function closeOv(){ stopTimer(); ov.classList.remove("on"); render(); }
function ovTop(title,timer){ return `<div class="top"><button class="x" onclick="closeOv()">✕</button><b>${title}</b>${timer?'<span class="timer" id="qtimer">8:00</span>':""}</div>`; }

// ---------- QUIZ ENGINE ----------
let Q=null,TMR=null;
function shuffle(n){ const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function startQuiz(items,title,onDone,opts){
  Q={items,i:0,good:0,onDone,title,missBase:(opts&&opts.missBase)||null,timed:!!(opts&&opts.timed)};
  if(Q.timed) startTimer(480);
  quizStep();
}
function startTimer(sec){
  stopTimer(); Q.left=sec;
  TMR=setInterval(()=>{
    Q.left--;
    const el=document.getElementById("qtimer");
    if(el){ el.textContent=Math.floor(Q.left/60)+":"+String(Q.left%60).padStart(2,"0"); if(Q.left<=60) el.classList.add("low"); }
    if(Q.left<=0){ stopTimer(); if(Q&&Q.onDone){ const cb=Q.onDone; const g=Q.good,t=Q.items.length; Q=null; cb(g,t,true); } }
  },1000);
}
function stopTimer(){ if(TMR){clearInterval(TMR);TMR=null;} }
function quizStep(){
  const q=Q.items[Q.i];
  Q.map=shuffle(q.opts.length);
  openOv(ovTop(Q.title,Q.timed)+`
    <div class="prog">Question ${Q.i+1}/${Q.items.length}${Q.from?` — <span style="color:var(--acc)">${Q.from}</span>`:""}</div>
    ${q.from?`<div class="prog" style="margin-top:-6px">${q.from}</div>`:""}
    <div class="qq">${q.q}</div>
    ${Q.map.map((oi,pos)=>`<button class="opt" onclick="answer(${pos})">${q.opts[oi]}</button>`).join("")}
    <div id="qexp"></div>`);
  if(Q.timed&&Q.left!=null){const el=document.getElementById("qtimer");if(el){el.textContent=Math.floor(Q.left/60)+":"+String(Q.left%60).padStart(2,"0");if(Q.left<=60)el.classList.add("low");}}
}
function answer(pos){
  const q=Q.items[Q.i],orig=Q.map[pos],ok=orig===q.a;
  if(ok){ Q.good++; if(q.ref){ S.miss=S.miss.filter(m=>m!==q.ref); save(); } }
  else if(Q.missBase){ recMiss(Q.missBase(Q.i)); save(); }
  else if(q.ref){ /* rattrapage raté : la question reste */ }
  document.querySelectorAll(".opt").forEach((b,k)=>{
    b.disabled=true;
    if(Q.map[k]===q.a) b.classList.add("ok");
    else if(k===pos) b.classList.add("ko");
  });
  document.getElementById("qexp").innerHTML=`<div class="exp"><b style="color:${ok?"var(--ok)":"var(--bad)"}">${ok?"Exact.":"Non."}</b> ${q.exp}</div>
    <button class="btn" onclick="quizNext()">${Q.i+1<Q.items.length?"Question suivante":"Voir le verdict"}</button>`;
}
function quizNext(){ Q.i++; if(Q.i<Q.items.length) quizStep(); else { stopTimer(); const cb=Q.onDone,g=Q.good,t=Q.items.length; Q=null; cb(g,t,false); } }

function quizVerdict(good,total,xp,extra){
  const pct=good/total;
  const verdict=pct===1?"Sans faute.":pct>=0.75?"Solide.":pct>=0.5?"Moyen. En entretien, « moyen » élimine.":"Insuffisant. Tes erreurs sont dans le Rattrapage — elles t'attendent.";
  openOv(ovTop("Verdict")+`
    <div class="result">
      <div class="big">${good}/${total}</div>
      <div class="xp">+${xp} XP</div>
      <p>${verdict}${extra||""}</p>
    </div>
    <button class="btn" onclick="closeOv()">Continuer</button>`);
}

    <p class="sub" style="margin:14px 0 6px">Choisis un thème, ou mélange tout :</p>

function startCardSession(catFilter){
  const pool=catFilter?FLASHCARDS.filter(c=>c.cat===catFilter):FLASHCARDS;
  const inPool=it=>pool.some(c=>c.id===it.id);
  const shuffled=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const due=shuffled(cardsDue().filter(inPool));
  const news=shuffled(cardsNewPool(pool)).slice(0,15);
  const queue=[...due,...news];
  if(!queue.length){
    if(!catFilter) checkMenu("cards"); // rien de dû ni de nouveau : l'exercice du jour est réputé fait
    openOv(ovTop("Flashcards")+`
      <div class="result"><div class="big">✓</div><p>Rien à réviser pour l'instant${catFilter?" dans « "+catFilter+" »":""}. La répétition espacée fait le reste — reviens quand une carte sera due.</p></div>
      <button class="btn ghost" onclick="closeOv()">Fermer</button>`);
    return;
  }
  CS={queue,i:0,revealed:false,catFilter,startCount:queue.length,good:0,attempted:new Set(),relearned:0};
  cardStep();
}
function cardPickerHtml(){
  const cats=["Lexique","Multiples","IPO","LBO","Realite"];
  const labels={Lexique:"Lexique",Multiples:"Multiples",IPO:"IPO",LBO:"LBO",Realite:"Réalité du métier"};
  return `<div class="catpick">${cats.map(c=>`<button onclick="startCardSession('${c}')">${labels[c]}</button>`).join("")}<button onclick="startCardSession()">Tout mélanger</button></div>`;
}
function cardStep(){
  if(CS.i>=CS.queue.length) return cardSessionEnd();
  const it=CS.queue[CS.i], c=FLASHCARDS.find(x=>x.id===it.id);
  CS.revealed=false;
  const key=it.id+(it.rev?":r":"");
  const front=it.rev?c.verso:c.recto;
  const relearn=CS.attempted.has(key);
  openOv(ovTop("Flashcards")+`
    <div class="prog">Carte ${CS.i+1}/${CS.queue.length}${c.sub?` — ${c.sub}`:""}${relearn?' · <b style="color:var(--acc)">réapprentissage</b>':''}${isLeech(key)?' · 🩸':''}</div>
    <div class="cardprog"><i style="width:${Math.round(CS.i/CS.queue.length*100)}%"></i></div>
    <div class="cardbox" onclick="flipCard()">
      <div class="side">${it.rev?"Définition → trouve le terme":"Terme → définition"}</div>
      <div class="txt ${it.rev?"def":""}">${front}</div>
      <div class="hint">Touche la carte pour retourner</div>
    </div>`);
}
function flipCard(){
  if(CS.revealed) return;
  CS.revealed=true;
  const it=CS.queue[CS.i], c=FLASHCARDS.find(x=>x.id===it.id);
  const key=it.id+(it.rev?":r":"");
  const front=it.rev?c.verso:c.recto;
  const back=it.rev?c.recto:c.verso;
  document.querySelector(".cardbox").outerHTML=`
    <div class="cardbox">
      <div class="cardq">${front}</div>
      <div class="txt ${!it.rev?"def":""}">${back}</div>
    </div>`;
  const div=document.createElement("div");
  div.className="raterow";
  div.innerHTML=`
    <button class="rag" onclick="rateCard(0)">Oublié<small>${ivlLabel(0)}</small></button>
    <button class="rha" onclick="rateCard(1)">Difficile<small>${ivlLabel(nextIvl(key,1))}</small></button>
    <button class="rgo" onclick="rateCard(2)">Bien<small>${ivlLabel(nextIvl(key,2))}</small></button>
    <button class="rea" onclick="rateCard(3)">Facile<small>${ivlLabel(nextIvl(key,3))}</small></button>`;
  document.getElementById("ovin").appendChild(div);
}
function rateCard(q){
  const it=CS.queue[CS.i], key=it.id+(it.rev?":r":"");
  const firstTry=!CS.attempted.has(key);
  CS.attempted.add(key);
  rateCardEntry(key,q); save();
  if(q>=2 && firstTry) CS.good++;
  addXP(firstTry?q+1:1);
  if(q===0){
    /* réapprentissage : la carte revient 3 positions plus loin, dans la même session */
    CS.relearned++;
    CS.queue.splice(Math.min(CS.i+4,CS.queue.length),0,it);
  }
  CS.i++;
  cardStep();
}
function cardSessionEnd(){
  checkMenu("cards");
  const pct=CS.startCount?Math.round(CS.good/CS.startCount*100):0;
  const fc1=cardsForecast(1), fc7=cardsForecast(7);
  const msg=pct>=80?"Mémoire solide sur cette session — la répétition espacée qui tient.":
    pct>=50?"Correct. Les cartes ratées sont repassées dans la session : c'est comme ça qu'elles rentrent.":
    "Beaucoup d'oublis, et c'est normal en phase de découverte. Tu les as rejouées jusqu'à les tenir — elles reviendront demain pour confirmer.";
  openOv(ovTop("Session terminée")+`
    <div class="result">
      <div class="big">${CS.startCount}</div>
      <div class="xp">cartes travaillées · ${pct} % du premier coup${CS.relearned?` · ${CS.relearned} réapprise${CS.relearned>1?"s":""} en session`:""}</div>
      <p>${msg}</p>
    </div>
    <div class="pt">📅 <b>Demain : ${fc1} carte${fc1>1?"s":""}</b> · dans les 7 jours : ${fc7}. C'est le planificateur qui décide, pas ton envie — c'est pour ça que ça marche.</div>
    ${cardPickerHtml()}
    <button class="btn ghost" onclick="closeOv()">Fermer</button>`);
  CS=null;
}

  const items=key==="chiffres"?P.chiffres:key==="meca"?P.meca.q:P.reflexe;
  PALQ={type,id,key,items,i:0,good:0};
  palAskStep();
}
function palAskStep(){
  const q=PALQ.items[PALQ.i], s=palItem(PALQ.type,PALQ.id);
  openOv(ovTop(PAL_LAB[PALQ.key]+" — "+s.title)+`
    <div class="prog">Question ${PALQ.i+1}/${PALQ.items.length}</div>
    ${PALQ.key!=="meca"?`<details style="margin-bottom:12px;color:var(--dim);font-size:13px"><summary>Relire l'énoncé</summary><p style="margin-top:8px;color:var(--txt);line-height:1.55">${s.setup}</p></details>`:""}
    <div class="qq">${q.q}</div>
    ${q.opts.map((o,k)=>`<button class="opt" onclick="palAnswer(${k})"><b style="color:var(--acc)">${"ABCD"[k]}.</b> ${o}</button>`).join("")}
    <div id="palexp"></div>`);
}
function palAnswer(k){
  const q=PALQ.items[PALQ.i], ok=k===q.a;
  if(ok) PALQ.good++;
  document.querySelectorAll(".opt").forEach((b,j)=>{
    b.disabled=true;
    if(j===q.a) b.classList.add("ok"); else if(j===k) b.classList.add("ko");
  });
  document.getElementById("palexp").innerHTML=`<div class="exp"><b style="color:${ok?"var(--ok)":"var(--bad)"}">${ok?"Exact.":"Non."}</b> ${q.exp}</div>
    <button class="btn" onclick="palAskNext()">${PALQ.i+1<PALQ.items.length?"Question suivante":"Marche franchie"}</button>`;
}
function palAskNext(){
  PALQ.i++;
  if(PALQ.i<PALQ.items.length) return palAskStep();
  const {type,id,key,good,items}=PALQ; PALQ=null;
  const xp=3+good*2, first=palMark(id,key,xp);
  const s=palItem(type,id);
  const msg=good===items.length?"Marche franchie proprement. La suivante s'appuie dessus."
    :good?"Presque. Relis l'explication de ce que tu as raté — c'est exactement ce qui te manquait pour comprendre le cas."
    :"Rien de grave : c'est la marche qui sert à ça. Refais-la, elle sera à toi en trois minutes.";
  openOv(ovTop("Marche "+(PAL_STEPS.findIndex(x=>x.k===key)+1)+"/5")+`
    <div class="result">
      <div class="big">${good}/${items.length}</div>
      ${first?`<div class="xp">+${xp} XP</div>`:""}
      <p>${msg}</p>
    </div>
    <button class="btn" onclick="openPaliers('${type}','${id}')">Retour à l'escalier</button>
    <button class="btn ghost" onclick="palAsk('${type}','${id}','${key}')">Refaire cette marche</button>`);
}
let PALG=null;
function palGuide(type,id){
  const s=palItem(type,id), P=PALIERS[id];
  const steps=P.guide.map((g,i)=>({q:g.q||(s.questions?s.questions[i]:s.task),p:g.p}));
  PALG={type,id,steps,i:0,ans:[]};
  palGuideStep();
}
function palGuideStep(){
  const st=PALG.steps[PALG.i], s=palItem(PALG.type,PALG.id), last=PALG.i+1>=PALG.steps.length;
  openOv(ovTop("Guidé — "+s.title)+`
    <div class="prog">Question ${PALG.i+1}/${PALG.steps.length} — une seule à la fois</div>
    <details style="margin-bottom:12px;color:var(--dim);font-size:13px"><summary>Relire l'énoncé</summary><p style="margin-top:8px;color:var(--txt);line-height:1.55">${s.setup}</p></details>
    <div class="qq">${st.q}</div>
    <div class="coach"><b>Ta réponse doit contenir :</b>
      <ul style="margin:8px 0 0 18px;padding:0">${st.p.map(x=>`<li style="margin-bottom:5px">${x}</li>`).join("")}</ul>
    </div>
    <p class="sub" style="margin:12px 0 6px">Réponds à cette question seulement. <b>Minimum 120 caractères</b> — on est à l'entraînement, pas encore devant le board.</p>
    <textarea id="palTxt" placeholder="Une phrase par piste, ça suffit pour commencer…" oninput="document.getElementById('gnext').disabled=this.value.trim().length<120">${esc(PALG.ans[PALG.i]||"")}</textarea>
    <button class="btn" id="gnext" disabled onclick="palGuideNext()">${last?"Voir la correction":"Question suivante"}</button>
    <button class="btn ghost" onclick="openPaliers('${PALG.type}','${PALG.id}')">Abandonner cette marche</button>`);
  const t=document.getElementById("palTxt");
  if(t&&t.value.trim().length>=120) document.getElementById("gnext").disabled=false;
}
function palGuideNext(){
  PALG.ans[PALG.i]=document.getElementById("palTxt").value;
  PALG.i++;
  if(PALG.i<PALG.steps.length) return palGuideStep();
  const {type,id,steps,ans}=PALG; PALG=null;
  palMark(id,"guide",6);
  const txt=steps.map((st,i)=>"— "+st.q+"\n"+(ans[i]||"")).join("\n\n");
  revealGrid(type,id,txt);
}
function openSpar(type,id){
  if(type==="teaser") return openTeaser(id);
  if(typeof PALIERS!=="undefined"&&PALIERS[id]&&palCount(id)<5&&!SPAR[type].d().includes(id)) return openPaliers(type,id);
  return openSparFull(type,id);
}
function openSparFull(type,id){
  const s=SPAR[type].l().find(x=>x.id===id);
  const qs=s.questions?s.questions.map((q,i)=>`<div class="gridpt"><b>Q${i+1}.</b> ${q}</div>`).join(""):`<div class="gridpt"><b>Mission :</b> ${s.task}</div>`;
  const ctx={case:"Tu es le DAF. Le board attend.",nego:"Négociation en conditions réelles.",cascade:"Déroule les trois états, dans l'ordre, en chiffrant tout.",plbo:"Chrono mental : 5 minutes en entretien réel."}[type];
  const lad=typeof PALIERS!=="undefined"&&PALIERS[id];
  openOv(ovTop(s.title)+`
    <div class="meta"><span class="tag ${type==="case"?"":"b"}">${s.tag}</span>${ctx}</div>
    <div class="story"><p>${s.setup}</p></div>
    ${qs}
    <p class="sub" style="margin:12px 0 6px">Ta réponse écrite — complète, structurée, chiffrée quand c'est possible. <b>Minimum 200 caractères, le flou ne passe pas.</b></p>
    <textarea id="sparTxt" placeholder="Écris comme si l'associé lisait par-dessus ton épaule…" oninput="document.getElementById('revealBtn').disabled=this.value.trim().length<200"></textarea>
    <button class="btn" id="revealBtn" disabled onclick="revealGrid('${type}','${id}')">Révéler la grille de correction</button>
    ${lad?`<button class="btn ghost" onclick="openPaliers('${type}','${id}')">🪜 Trop raide ? Reprendre par l'escalier (${palCount(id)}/5)</button>`:""}`);
}
function revealGrid(type,id,txt){
  const s=SPAR[type].l().find(x=>x.id===id);
  const el=document.getElementById("sparTxt");
  const mine=txt!=null?txt:(el?el.value:"");
  openOv(ovTop(s.title+" — correction")+`
    <p class="sub" style="margin-bottom:10px">Point par point : coche UNIQUEMENT ce que ta réponse écrite contenait vraiment. Le score se calcule tout seul.</p>
    ${s.grid.map((g,i)=>`<label class="gridpt" style="display:flex;gap:10px;cursor:pointer"><input type="checkbox" class="gchk" style="margin-top:3px;flex-shrink:0;accent-color:var(--acc);width:17px;height:17px"><span><b>${i+1}.</b> ${g}</span></label>`).join("")}
    <div class="coachnote"><b>Le coach :</b> ${s.coach}</div>
    <details style="margin-top:12px;color:var(--dim);font-size:13px"><summary>Relire ma réponse</summary><p style="white-space:pre-wrap;margin-top:8px;color:var(--txt)">${esc(mine)}</p></details>
    <button class="btn" onclick="gridScore('${type}','${id}',${s.grid.length})">Calculer mon score</button>`);
}
function gridScore(type,id,total){
  const got=document.querySelectorAll(".gchk:checked").length;
  const ratio=got/total;
  const lvl=ratio>=0.75?2:ratio>=0.4?1:0;
  selfScore(type,id,lvl,got+"/"+total+" points de la grille");
}
function selfScore(type,id,lvl,detail){
  const arr=SPAR[type].d();
  const first=!arr.includes(id);
  if(first){ arr.push(id); scheduleRev(type,id); } else bumpRev(type,id);
  const xp=Math.round([4,12,25][lvl]*(first?1:0.5));
  addXP(xp); checkMenu(type,id); save();
  const msg=[
    "Raté assumé — c'est déjà mieux que raté maquillé. Ce cas reviendra en révision : la prochaine fois, tu le plies.",
    "Partiel. Tu as vu une partie du terrain. Relis les points manqués À VOIX HAUTE — c'est comme ça qu'on les garde.",
    "Solide. C'est le niveau. La révision espacée vérifiera si c'est encore vrai dans trois jours."
  ][lvl];
  openOv(ovTop("Verdict")+`
    <div class="result">
      <div class="big">${["😤","📈","🏆"][lvl]}</div>
      ${detail?`<div style="font-weight:800;font-size:18px;margin-top:4px">${detail}</div>`:""}
      <div class="xp">+${xp} XP</div>
      <p>${msg}</p>
    </div>
    <button class="btn" onclick="closeOv()">Continuer</button>`);
}
function openTeaser(id){
  const t=TEASERS.find(x=>x.id===id);
  openOv(ovTop("Brain teaser — "+t.cat)+`
    <div class="qq" style="margin-top:6px">${t.q}</div>
    <div class="coach">Réponds à voix haute ou sur papier, <b>comme en entretien</b>. Structure d'abord, chiffre ensuite. Puis seulement, révèle.</div>
    <button class="btn" onclick="revealTeaser('${t.id}')">Révéler la solution</button>`);
}
function revealTeaser(id){
  const t=TEASERS.find(x=>x.id===id);
  openOv(ovTop("Solution")+`
    <div class="qq" style="font-size:14px;color:var(--dim)">${t.q}</div>
    <div class="gridpt" style="margin-top:10px">${t.sol}</div>
    <p class="sub" style="margin:16px 0 4px">Tu l'avais ?</p>
    <div class="selfrow">
      <button class="btn r" onclick="selfScore('teaser','${id}',0)">Non</button>
      <button class="btn m" onclick="selfScore('teaser','${id}',1)">Presque</button>
      <button class="btn s" onclick="selfScore('teaser','${id}',2)">Oui, structuré</button>
    </div>`);
}

// ---------- RATTRAPAGE ----------
function startRattrapage(){
  const items=missItems();
  if(!items.length) return toast("Rien à rattraper. Pour l'instant.");
  const picked=items.sort(()=>Math.random()-.5).slice(0,10)
    .map(x=>Object.assign({},x.q,{ref:x.ref,from:x.from}));
  startQuiz(picked,"Rattrapage",(good,total)=>{
    const xp=good*2;
    addXP(xp); save();
    quizVerdict(good,total,xp,` Il reste ${S.miss.length} question${S.miss.length>1?"s":""} au tableau des erreurs.`);
  });
}

// ---------- MODE ENTRETIEN ----------
function startInterview(){
  const pool=[];
  DEALS.forEach(d=>d.questions.forEach((q,i)=>pool.push(Object.assign({},q,{from:"Deal — "+d.title,base:"D|"+d.id+"|"+i}))));
  LESSONS.forEach(l=>l.questions.forEach((q,i)=>pool.push(Object.assign({},q,{from:"Leçon — "+l.title,base:"L|"+l.id+"|"+i}))));
  MASTERCLASS.forEach(c=>c.questions.forEach((q,i)=>pool.push(Object.assign({},q,{from:"Masterclass — "+c.domain,base:"M|"+c.id+"|"+i}))));
  const picked=pool.sort(()=>Math.random()-.5).slice(0,12);
  openOv(ovTop("Mode entretien")+`
    <div class="qq" style="margin-top:6px">12 questions. 8 minutes. Tous les sujets.</div>
    <div class="coach">Un associé ne te laisse pas réfléchir dix minutes par question, et il mélange DCF, SPA et culture des deals dans la même conversation. <b>Le chrono démarre quand tu cliques.</b> Les questions ratées iront au Rattrapage.</div>
    <button class="btn" onclick='launchInterview(${JSON.stringify(picked.map(p=>p.base))})'>Je suis prêt</button>`);
}
function launchInterview(bases){
  const items=bases.map(b=>{
    const [k,id,qi]=b.split("|");
    const src=k==="D"?DEALS.find(d=>d.id===id):k==="M"?MASTERCLASS.find(x=>x.id===id):LESSONS.find(l=>l.id===id);
    const label=k==="D"?"Deal — "+src.title:k==="M"?"Masterclass — "+src.domain:"Leçon — "+src.title;
    return Object.assign({},src.questions[qi],{from:label});
  });
  let idx=0;
  startQuiz(items,"Entretien",(good,total,timedOut)=>{
    S.itv.runs++; if(good>S.itv.best) S.itv.best=good;
    const xp=good*3; addXP(xp); save();
    const v=timedOut?"Temps écoulé — en entretien aussi, le silence compte comme une mauvaise réponse.":
      good>=11?"Offre. On te rappelle avant les autres.":
      good>=9?"Tour suivant. Solide, pas parfait — un associé t'aurait poussé sur les ratées.":
      good>=6?"Repêchage incertain. La moitié du métier te résiste encore.":
      "Recalé. En vrai entretien, on t'aurait arrêté à la question 6. Retour à l'Académie, puis reviens.";
    openOv(ovTop("Verdict du recruteur")+`
      <div class="result">
        <div class="big">${good}/${total}</div>
        <div class="xp">+${xp} XP${good===S.itv.best&&good>0?" · record":""}</div>
        <p>${v}</p>
      </div>
      <button class="btn" onclick="startInterview()">Nouvel entretien</button>
      <button class="btn ghost" onclick="closeOv()">Sortir</button>`);
  },{timed:true,missBase:i=>{
    const [k,id,qi]=bases[i].split("|"); return k+"|"+id+"|"+qi;
  }});
}

// ---------- LE MÉMO DU DIMANCHE ----------
const MEMO_SECTIONS=[
  ["Société & thèse","La société analysée, et ta thèse en 2 phrases : pourquoi elle mérite (ou non) qu'on y mette de l'argent."],
  ["Le business","Ce qu'elle vend, à qui, avec quel avantage compétitif. Le pricing power en une phrase."],
  ["Les chiffres","CA, croissance, marge d'EBITDA, dette nette/EBITDA, conversion en cash. Les 5 chiffres qui comptent, sourcés."],
  ["Valorisation","Multiple actuel vs comparables, et ton estimation : chère, correcte, décotée ? Justifie."],
  ["Risques","Les 3 risques majeurs — les vrais, pas ceux de la plaquette."],
  ["Verdict","Achat, vente, ou passe. Une position ferme et son niveau de conviction. Le flou est interdit ici plus qu'ailleurs."]
];
function openMemo(){
  openOv(ovTop("Le mémo du dimanche")+`
    <div class="coach">Une page, une vraie société, une position ferme. Rédige chaque section, puis exporte : tu le colles à ton coach (Claude) pour une correction d'associé — c'est la partie qui te fait progresser. Brouillon sauvegardé automatiquement.</div>
    ${MEMO_SECTIONS.map((s,i)=>`
      <p class="sub" style="margin:12px 0 4px"><b style="color:var(--acc)">${i+1}. ${s[0]}</b> — ${s[1]}</p>
      <textarea style="min-height:70px" oninput="saveMemoField(${i},this.value)" id="memo${i}">${esc(S.memoDraft[i]||"")}</textarea>`).join("")}
    <button class="btn" onclick="finishMemo()">Assembler & copier le mémo (+40 XP)</button>
    <button class="btn ghost" onclick="closeOv()">Fermer (brouillon conservé)</button>`);
}
function saveMemoField(i,v){ S.memoDraft[i]=v; save(); }
function finishMemo(){
  const parts=MEMO_SECTIONS.map((s,i)=>(S.memoDraft[i]||"").trim());
  const totalLen=parts.join("").length;
  const empty=parts.filter(p=>p.length<40).length;
  if(empty>0||totalLen<600){ toast("❌ <b>Mémo incomplet.</b> Chaque section ≥ 40 caractères, 600 au total. Un mémo à moitié écrit est un mémo qu'on ne lit pas."); return; }
  const txt="MÉMO D'INVESTISSEMENT — "+new Date().toLocaleDateString("fr-FR")+"\n\n"+MEMO_SECTIONS.map((s,i)=>s[0].toUpperCase()+"\n"+parts[i]).join("\n\n")+"\n\n— Rédigé dans LE CLOSING. Coach : corrige-moi ce mémo comme un associé le ferait.";
  const doneMsg=()=>{ S.memos++; S.memoDraft={}; addXP(40); save();
    openOv(ovTop("Mémo n°"+S.memos+" assemblé")+`
      <div class="result"><div class="big">📝</div><div class="xp">+40 XP</div>
      <p>Copié dans le presse-papiers. Maintenant la vraie étape : <b>colle-le à ton coach</b> et encaisse la correction. Un mémo non soumis est un monologue.</p></div>
      <button class="btn" onclick="closeOv()">Continuer</button>`); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(doneMsg,()=>{prompt("Copie ton mémo :",txt);doneMsg();});
  else { prompt("Copie ton mémo :",txt); doneMsg(); }
}
