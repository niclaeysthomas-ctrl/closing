<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070b13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Le Closing">
<link rel="manifest" href="manifest.webmanifest">
<title>LE CLOSING — deviens le directeur financier</title>
<style>
  :root{
    --bg:#070b13; --bg2:#0d1320; --bg3:#151d30; --line:#212b41;
    --txt:#e8ebf2; --dim:#8a94ab;
    --acc:#d6b25e; --accd:#a98c3f;
    --blue:#5b9cff; --ok:#1fc584; --bad:#f4506a; --purple:#a78bfa;
    --r:12px;
    --serif:Georgia,'Times New Roman',serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overscroll-behavior:none;
    background-image:linear-gradient(rgba(120,145,190,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(120,145,190,.035) 1px,transparent 1px);
    background-size:26px 26px;background-attachment:fixed}
  #app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  main{flex:1;padding:16px 16px 92px}
  header{padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between}
  .logo{font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:2.5px}
  .logo span{color:var(--acc)}
  .hbadges{display:flex;gap:7px}
  .badge{font-family:var(--mono);font-weight:700;font-size:11.5px;background:var(--bg2);border:1px solid var(--line);padding:6px 10px;border-radius:8px;letter-spacing:.3px}
  .badge.gold{color:var(--acc);border-color:#453a20}

  #ticker{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#050810;margin-top:12px}
  .tkwrap{display:inline-flex;white-space:nowrap;animation:tk 50s linear infinite;will-change:transform}
  .tkwrap span{padding:7px 20px 7px 0;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.6px;color:var(--dim)}
  .tkwrap b{color:var(--acc);font-weight:700}
  .tkwrap .up{color:var(--ok)} .tkwrap .dn{color:var(--bad)}
  @keyframes tk{to{transform:translateX(-50%)}}

  h1.page{font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:.3px;margin-bottom:4px}
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.6px;color:var(--dim);margin:18px 0 8px;padding-left:2px;display:flex;align-items:center;gap:10px}
  h2.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  .sub{color:var(--dim);font-size:13px;margin-bottom:14px}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}

  .hero{background:linear-gradient(135deg,#101528,#1b1710);border:1px solid #453a20;border-top:2px solid var(--acc);border-radius:var(--r);padding:16px;margin-bottom:12px;position:relative}
  .hero::after{content:"POSITION";position:absolute;top:10px;right:14px;font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--dim);opacity:.7}
  .hero .rank{font-family:var(--serif);font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--acc);font-weight:700}
  .hero .big{font-family:var(--mono);font-size:22px;font-weight:800;margin:3px 0 8px;font-variant-numeric:tabular-nums}
  .xpbar{height:9px;border-radius:2px;background:#0009;overflow:hidden;margin:6px 0 4px}
  .xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accd),var(--acc));border-radius:2px;transition:width .4s}
  .xptxt{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.2px}

  /* ---------- LE FORMULAIRE ---------- */
  .fmcats{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .fmcats button{border:none;border-radius:999px;padding:7px 11px;font-size:11.5px;font-weight:700;cursor:pointer;background:var(--bg);color:var(--dim)}
  .fmcats button.on{background:var(--acc);color:#1a1300}
  .fmc{background:var(--bg);border:1px solid var(--line);border-radius:11px;margin-bottom:7px;overflow:hidden}
  .fmh{display:flex;align-items:center;gap:9px;padding:11px 12px;cursor:pointer}
  .fmh .i{font-size:17px}
  .fmh b{font-size:13.5px;flex:1;line-height:1.3}
  .fmh .ar{color:var(--dim);font-size:11px}
  .fmb{display:none;padding:0 12px 12px}
  .fmc.open .fmb{display:block}
  .fmq{font-size:12.5px;color:var(--dim);line-height:1.5;margin-bottom:9px;font-style:italic}
  .fmf{font-family:var(--mono);font-size:12px;background:#0f1420;border-left:3px solid var(--acc);border-radius:0 8px 8px 0;
    padding:10px 11px;color:var(--acc);white-space:pre-wrap;line-height:1.6;margin-bottom:11px}
  .fmin{display:grid;grid-template-columns:1fr auto;gap:7px 9px;align-items:center;margin-bottom:10px}
  .fmin label{font-size:12px;color:var(--dim)}
  .fmin input{width:110px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--txt);
    padding:8px 9px;font-family:var(--mono);font-size:14px;text-align:right}
  .fmin input:focus{outline:none;border-color:var(--acc)}
  .fmr{background:var(--bg2);border-radius:9px;padding:11px 12px;font-size:13px;line-height:1.55;margin-bottom:9px}
  .fmr .v{font-family:var(--mono);font-size:19px;font-weight:800;color:var(--acc);display:block;margin-bottom:5px}
  .fmn{font-size:12.5px;line-height:1.55;color:#c7ccd6;margin-bottom:7px}
  .fmp{font-size:12.5px;line-height:1.55;color:#e8b98a;background:rgba(232,163,61,.08);border-radius:8px;padding:9px 10px}
  .fmp b{color:var(--acc)}
  .fmacts{display:flex;gap:6px;margin-bottom:10px}
  .fmacts button{flex:1;border:none;border-radius:9px;padding:9px 4px;font-size:11.5px;font-weight:700;cursor:pointer;background:var(--bg2);color:var(--dim)}
  .fmacts button:active{background:var(--line)}
  /* ---------- LA CALCULATRICE (écrans de décision) ---------- */
  .calcw{background:var(--bg2);border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden}
  .calch{display:flex;align-items:center;gap:8px;padding:11px 13px;cursor:pointer;user-select:none}
  .calch b{font-size:13.5px;flex:1}
  .calch .ar{color:var(--dim);font-size:12px;transition:transform .15s}
  .calcw.open .calch .ar{transform:rotate(90deg)}
  .calcb{display:none;padding:0 13px 13px}
  .calcw.open .calcb{display:block}
  .calcin{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--txt);
    padding:11px 12px;font-family:var(--mono);font-size:16px;text-align:right}
  .calcin:focus{outline:none;border-color:var(--acc)}
  .calcout{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--acc);text-align:right;
    padding:8px 2px 2px;min-height:30px;word-break:break-all}
  .calcout.err{color:var(--bad);font-size:12px;font-weight:400}
  .calcpad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
  .calcpad button{border:none;border-radius:10px;padding:13px 0;font-size:16px;font-weight:700;cursor:pointer;
    background:var(--bg);color:var(--txt);font-family:var(--mono)}
  .calcpad button:active{background:var(--line)}
  .calcpad button.op{background:#2a2213;color:var(--acc)}
  .calcpad button.eq{background:var(--acc);color:#1a1300}
  .calcpad button.del{background:#2a1a1a;color:var(--bad)}
  .calcvars{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .calcvars button{border:none;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer;
    background:var(--bg);color:var(--dim);font-family:var(--mono)}
  .calcvars button:active{background:var(--line);color:var(--acc)}
  .calcmem{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:8px;line-height:1.7}
  .calcmem span{color:var(--acc);cursor:pointer}


  .coach{background:var(--bg2);border-left:3px solid var(--acc);border-radius:0 var(--r) var(--r) 0;padding:13px 14px;margin-bottom:12px;font-size:14px;line-height:1.5}
  .coach b{color:var(--acc)}

  .act{display:flex;align-items:center;gap:11px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:8px;cursor:pointer}
  .act:active{background:var(--bg3)}
  .act .ico{width:38px;height:38px;border-radius:11px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .act .t{flex:1;min-width:0}
  .act .t b{display:block;font-size:14px}
  .act .t small{color:var(--dim);font-size:12px;line-height:1.35;display:block;margin-top:1px}
  .act .st{font-size:18px;flex-shrink:0;color:var(--dim)}
  .act.done{opacity:.55}
  .act.done .st{color:var(--ok)}
  .act.rev{border-color:#3a3420}

  .tag{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;background:var(--bg3);color:var(--acc);border:1px solid #3d3626;padding:3px 8px;border-radius:5px;margin-right:6px}
  .tag.b{color:var(--blue);border-color:#1e2c4a}

  .btn{display:block;border:none;border-radius:12px;padding:13px 20px;font-size:15px;font-weight:700;cursor:pointer;background:var(--acc);color:#1a1300;width:100%;text-align:center;margin-top:12px}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--bg3);color:var(--txt);border:1px solid var(--line)}
  .btn[disabled]{opacity:.4;pointer-events:none}

  #ov{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;overflow-y:auto}
  #ov.on{display:block}
  #ov .inner{max-width:520px;margin:0 auto;padding:14px 16px 60px}
  #ov .top{display:flex;align-items:center;gap:10px;margin-bottom:14px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
  #ov .top .x{width:36px;height:36px;border-radius:11px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);font-size:16px;cursor:pointer;flex-shrink:0}
  #ov .top b{font-family:var(--serif);font-size:17px;letter-spacing:.3px;flex:1}
  #ov .top .timer{font-family:var(--mono);font-size:15px;font-weight:800;color:var(--acc);background:var(--bg2);border:1px solid #453a20;padding:6px 11px;border-radius:8px;font-variant-numeric:tabular-nums}
  #ov .top .timer.low{color:var(--bad);border-color:#55232c}
  .story p{font-family:var(--serif);font-size:15.5px;line-height:1.72;color:#dde1ea;margin-bottom:14px}
  .meta{color:var(--dim);font-size:12.5px;margin-bottom:12px}

  .qq{font-size:16px;font-weight:700;line-height:1.45;margin-bottom:14px}
  .opt{display:block;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:14px;line-height:1.4;color:var(--txt);margin-bottom:8px;cursor:pointer}
  .opt.ok{border-color:var(--ok);background:#10231a}
  .opt.ko{border-color:var(--bad);background:#2a151a}
  .opt[disabled]{cursor:default}
  .exp{background:var(--bg3);border-radius:12px;padding:12px;font-size:13.5px;line-height:1.5;color:#cfd3d9;margin:4px 0 8px;border-left:3px solid var(--acc)}
  .prog{font-family:var(--mono);font-size:11px;letter-spacing:.4px;color:var(--dim);margin-bottom:10px}

  .bld{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin:10px 0}
  .bldr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .bldr:last-child{border-bottom:none}
  .bldr .lb{flex:1;font-size:13.5px;line-height:1.35}
  .bldr .lb small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
  .bldr input{width:120px;flex:0 0 120px;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    color:var(--txt);padding:9px 10px;font-size:15px;font-weight:700;text-align:right;font-family:inherit}
  .bldr input:focus{outline:none;border-color:var(--acc)}
  .bldr.ok input{border-color:var(--ok);color:var(--ok)}
  .bldr.ko input{border-color:var(--bad);color:var(--bad)}
  .bldr .vd{flex:0 0 22px;text-align:center;font-size:16px}
  .bldfix{font-size:12.5px;line-height:1.55;color:var(--dim);padding:0 0 10px 0}
  .bldfix b{color:var(--txt)}
  .bldfix .rg{color:var(--ok);font-weight:800}
  .bldtot{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:10px;
    background:var(--bg2);border:1px solid var(--line);margin:10px 0;font-weight:800}
  textarea{width:100%;min-height:130px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:12px;font-size:14px;font-family:inherit;line-height:1.5;resize:vertical}
  textarea:focus{outline:none;border-color:var(--acc)}
  .gridpt{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:13.5px;line-height:1.55;color:#d5d8dd;margin-bottom:8px}
  .gridpt b{color:var(--acc)}
  .ngL{transition:border-color .12s,background .12s}
  /* Un levier non coché avait exactement l'apparence d'un bloc d'information :
     rien ne disait qu'il fallait le TOUCHER. On met une case vide. */
  .ngL::before{content:"○ ";color:var(--dim);font-weight:900}
  .ngL.on{border-color:var(--acc);background:#2a2213}
  .ngL.on::before{content:"✓ ";color:var(--acc);font-weight:900}
  .xptxt.gateko b{color:var(--acc)}
  .xptxt.gateok{color:var(--ok)}
  /* LA BOÎTE */
  .bridge{display:flex;align-items:center;gap:6px;text-align:center}
  .bridge>div:not(.op){flex:1;background:#080604;border:1px solid var(--line);border-radius:10px;padding:9px 4px}
  .bridge small{display:block;font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);font-weight:800;margin-bottom:3px}
  .bridge b{font-family:var(--mono);font-size:13.5px}
  .bridge .op{flex:0 0 auto;color:var(--dim);font-weight:800;font-size:15px}
  .bil{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bil .side{background:#080604;border:1px solid var(--line);border-radius:10px;padding:10px}
  .bil .sh{font-size:9.5px;letter-spacing:1.4px;color:var(--acc);font-weight:800;margin-bottom:7px}
  .bil .l{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;padding:3px 0;color:var(--dim)}
  .bil .l b{font-family:var(--mono);color:var(--txt);font-size:11.5px}
  .bil .l.tot{border-top:1px solid var(--line);margin-top:5px;padding-top:5px;font-weight:800}
  nav button{font-size:9.5px}
  .selfrow{display:flex;gap:8px;margin-top:12px}
  .selfrow .btn{margin-top:0;font-size:13px;padding:12px 6px}
  .selfrow .r{background:#3a1a20;color:var(--bad)}
  .selfrow .m{background:var(--bg3);color:var(--txt);border:1px solid var(--line)}
  .selfrow .s{background:var(--ok);color:#02180b}
  .coachnote{background:#141625;border:1px solid #3d3626;border-radius:12px;padding:12px 13px;font-size:13.5px;line-height:1.55;margin-top:10px}
  .coachnote b{color:var(--acc)}

  .accroche{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.55;color:var(--acc);border-left:3px solid var(--accd);padding:3px 0 3px 14px;margin:4px 0 16px}
  .lead{background:linear-gradient(135deg,#101526,#191712);border:1px solid #3d3626;border-top:2px solid var(--acc);border-radius:var(--r);padding:14px 15px;margin-bottom:14px}
  .lead .lbl{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--acc);display:block;margin-bottom:9px}
  .lead p{font-family:var(--serif);font-size:15px;line-height:1.62;color:#e6e9f0;margin-bottom:11px}
  .lead p:last-child{margin-bottom:0}
  .cle b,.pens b{color:var(--acc);display:block;margin-bottom:2px}

  .result{text-align:center;padding:26px 10px}
  .result .big{font-family:var(--mono);font-size:42px;font-weight:800;font-variant-numeric:tabular-nums}
  .result .xp{font-family:var(--mono);color:var(--acc);font-weight:800;font-size:15px;margin-top:6px}
  .result p{color:var(--dim);font-size:14px;margin-top:8px;line-height:1.5}

  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(7,11,19,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:40}
  nav .in{max-width:520px;margin:0 auto;display:flex}
  nav button{flex:1;background:none;border:none;color:var(--dim);font-size:10.5px;font-weight:700;padding:9px 0 max(9px,env(safe-area-inset-bottom));cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav button i{font-style:normal;font-size:19px}
  nav button.on{color:var(--acc)}

  .mod{display:flex;align-items:center;gap:11px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:8px;cursor:pointer}
  .mod .ico{font-size:22px}
  .mod .t{flex:1}
  .mod .t b{font-size:14.5px;display:block}
  .mod .t small{color:var(--dim);font-size:12px;line-height:1.35;display:block;margin-top:2px}
  .mod .pc{font-family:var(--mono);font-size:12px;font-weight:800;color:var(--acc)}
  .mod.gold{border-color:#3d3626;background:linear-gradient(135deg,#101526,#191712)}

  .ranks li{list-style:none;display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
  .ranks li:last-child{border:none}
  .ranks li.cur{color:var(--acc);font-weight:800}
  .ranks li.past{color:var(--dim)}
  .ranks li small{color:var(--dim)}

  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:13px;text-align:center}
  .stat b{font-family:var(--mono);font-size:21px;display:block;font-variant-numeric:tabular-nums}
  .stat small{font-family:var(--mono);color:var(--dim);font-size:10px;letter-spacing:.6px}
  .danger{color:var(--bad);background:none;border:1px solid #55232c;border-radius:12px;width:100%;padding:12px;font-size:13px;font-weight:700;cursor:pointer;margin-top:10px}

  .hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;justify-content:start;margin-top:10px;overflow-x:auto;padding-bottom:4px}
  .hm i{width:12px;height:12px;border-radius:3px;background:var(--bg3)}
  .hm i.on{background:var(--acc)}
  .hm i.today{outline:1px solid var(--dim)}

  .search{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:11px 13px;font-size:14px;margin-bottom:12px}
  .search:focus{outline:none;border-color:var(--acc)}
  .lex{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:7px}
  .lex .h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .lex .h b{font-size:14px}
  .lex .h .en{color:var(--blue);font-size:12px;font-style:italic}
  .lex .h .c{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dim)}
  .lex p{font-size:13px;color:#c8ccd2;line-height:1.5;margin-top:4px}

  #toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:#141625;border:1px solid #453a20;color:var(--txt);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:all .25s;max-width:90%;text-align:center}

  .cardbox{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:28px 20px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin-bottom:14px;animation:cardin .25s ease}
  @keyframes cardin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .cardbox .side{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--acc);margin-bottom:12px}

<script>
// ================= ÉTAT =================
const RANKS=[["Stagiaire",0],["Analyst",150],["Associate",400],["VP",800],["Director",1400],["Managing Director",2200],["Rainmaker",3200]];
const KEY="closing_v1";
const DEF={xp:0,streak:0,lastVal:"",done:{deals:[],lessons:[],cases:[],negos:[],teasers:[],cascades:[],plbo:[],feyn:[],mclass:[],eco:[]},menu:null,rev:[],miss:[],days:[],itv:{runs:0,best:0,runsEN:0,bestEN:0},missions:{},memos:0,memoDraft:{},cards:{},journal:[],biz:null,cimetiere:[],bizDone:[],bizRec:{},exos:{cur:1,p:{}},pal:{}};
let S=load();
function load(){
  let s={};
  try{ s=JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){}
  const o=Object.assign({},DEF,s);
  o.done=Object.assign({},DEF.done,s.done||{});
  o.itv=Object.assign({},DEF.itv,s.itv||{});
  o.rev=s.rev||[]; o.miss=s.miss||[]; o.days=s.days||[];
  o.missions=s.missions||{}; o.memos=s.memos||0; o.memoDraft=s.memoDraft||{};
  o.cards=s.cards||{};
  o.journal=s.journal||[];
  o.biz=s.biz||null;
  o.cimetiere=s.cimetiere||[];
  o.pal=s.pal||{};
  o.bizDone=s.bizDone||[];
  o.bizRec=s.bizRec||{};
  o.exos=s.exos||{cur:1,p:{}}; if(!o.exos.p) o.exos.p={}; if(!o.exos.cur) o.exos.cur=1;   /* les records par niveau — il n'y avait rien à battre */
  if(o.biz){ o.biz.loans=o.biz.loans||[]; o.biz.level=o.biz.level||1;
    o.biz.horizon=o.biz.horizon||36; o.biz.capacity=o.biz.capacity||1; }
  return o;
}
function save(){ localStorage.setItem(KEY,JSON.stringify(S)); }
function today(){ return new Date().toISOString().slice(0,10); }
function addDays(n){ const d=new Date(Date.now()+n*864e5); return d.toISOString().slice(0,10); }
function yesterday(){ return addDays(-1); }
function esc(x){ return String(x).replace(/</g,"&lt;"); }

function rank(){ let r=RANKS[0]; for(const x of RANKS){ if(S.xp>=x[1]) r=x; } return r; }
function nextRank(){ for(const x of RANKS){ if(S.xp<x[1]) return x; } return null; }
function dispStreak(){ return (S.lastVal===today()||S.lastVal===yesterday()) ? S.streak : 0; }
function addXP(n){
  if(n<=0){save();header();return;}
  const before=rank()[0]; S.xp+=n; save(); header();
  const after=rank()[0];
  if(after!==before) setTimeout(()=>toast("👑 <b>PROMOTION</b> — tu passes <b>"+after+"</b>. Le titre se garde en le méritant chaque jour."),700);
}
function header(){ document.getElementById("hstreak").textContent=dispStreak(); document.getElementById("hrank").textContent=rank()[0]; renderTicker(); }
function renderTicker(){
  const el=document.getElementById("tkin"); if(!el) return;
  const due=cardsDue().length, revN=dueRevs().length, missN=S.miss.length;
  const m=S.menu, dayOk=m&&m.date===today()&&m.validated;
  const items=[
    ["XP",S.xp,""],
    ["GRADE",rank()[0].toUpperCase(),""],
    ["STREAK",dispStreak()+(dispStreak()>0?" ▲":""),dispStreak()>0?"up":"dn"],
    ["JOURNÉE",dayOk?"VALIDÉE ▲":"EN COURS",dayOk?"up":""],
    ["DEALS",S.done.deals.length+"/"+DEALS.length,""],
    ["LEÇONS",S.done.lessons.length+"/"+LESSONS.length,""],
    ["CARTES DUES",due,due>0?"dn":"up"],
    ["RÉVISIONS",revN,revN>0?"dn":"up"],
    ["RATTRAPAGE",missN,missN>0?"dn":"up"],
    ["ENTRETIEN FR",S.itv.best+"/12",""],
    ["ENTRETIEN EN",S.itv.bestEN+"/12",""],
    ["MISSION",S.missions[isoWeek()]?"FAITE ▲":"OUVERTE",S.missions[isoWeek()]?"up":""],
    ["MÉMOS",S.memos,""]
  ];
  const html=items.map(x=>`<span>${x[0]} <b class="${x[2]}">${x[1]}</b></span>`).join("");
  el.innerHTML=html+html; // dupliqué pour la boucle sans couture
}
let toastT=null;
function toast(html){
  const t=document.getElementById("toast");
  t.innerHTML=html; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),3200);
}

// ================= SPARRING : registre des types =================
const SPAR={
  case:{l:()=>CASES,d:()=>S.done.cases,ico:"🪑",lab:"Sur la sellette"},
  nego:{l:()=>NEGOS,d:()=>S.done.negos,ico:"🤺",lab:"Négociation"},
  teaser:{l:()=>TEASERS,d:()=>S.done.teasers,ico:"🧠",lab:"Brain teaser"},
  cascade:{l:()=>CASCADES,d:()=>S.done.cascades,ico:"📊",lab:"Cascade comptable"},
  plbo:{l:()=>PLBO,d:()=>S.done.plbo,ico:"🧾",lab:"Paper LBO"},
  feyn:{l:()=>FEYNMAN,d:()=>S.done.feyn,ico:"🧒",lab:"Expliqué simplement"}
};
const SPARROT=["case","nego","cascade","teaser","plbo"];
function isoWeek(){
  const d=new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate()+3-((d.getDay()+6)%7));
  const w1=new Date(d.getFullYear(),0,4);
  return d.getFullYear()+"-W"+String(1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7)).padStart(2,"0");
}
function weekMission(){
  const wk=isoWeek();
  const n=parseInt(wk.slice(0,4))*53+parseInt(wk.slice(6));
  return {wk, m:MISSIONS[n%MISSIONS.length]};
}

// ================= RÉVISION ESPACÉE (J+3 / J+7 / J+21) =================
const STEPS=[3,7,21];
function scheduleRev(t,id){
  if(!S.rev.find(e=>e.t===t&&e.id===id)) S.rev.push({t,id,step:0,due:addDays(STEPS[0])});
}
function bumpRev(t,id){
  const e=S.rev.find(x=>x.t===t&&x.id===id);
  if(!e||e.due>today()) return;
  e.step++;
  if(e.step>=STEPS.length){ S.rev=S.rev.filter(x=>x!==e); toast("🧠 <b>Acquis.</b> Trois révisions tenues — ce sujet est à toi."); }
  else e.due=addDays(STEPS[e.step]);
}
function dueRevs(){ const t=today(); return S.rev.filter(e=>e.due<=t); }

// ---- Flashcards : vrai SM-2 (facteur de facilité par carte, réapprentissage en session,
// une entrée de planning PAR SENS terme→déf et déf→terme — ce sont deux mémoires différentes) ----
// Clés : "fc12" (endroit) et "fc12:r" (envers). L'envers n'entre en jeu
// qu'une fois l'endroit appris (reps>=1) : le vocabulaire d'abord, la production ensuite.
function cardEntry(key){ return S.cards[key]; }
function migrateCards(){
  // ancien format {step,due,seen} → SM-2 {ef,ivl,reps,due,lapses,seen}
  const CSTEPS=[1,3,7,16,35,90,180];
  let n=0;
  for(const k in S.cards){ const c=S.cards[k];
    if(c && c.step!==undefined && c.ef===undefined){
      S.cards[k]={ef:2.5, ivl:c.step>0?CSTEPS[Math.min(c.step,6)]:0, reps:Math.max(c.step,c.seen?1:0),
                  due:c.due, lapses:0, seen:c.seen||0}; n++;
    }
  }
  if(n) save();
}
migrateCards();
function fuzz(d){ return d>=3 ? Math.max(1,Math.round(d*(0.93+Math.random()*0.14))) : d; }
/* intervalle candidat sans engager la carte — pour l'afficher sur les boutons */
function nextIvl(key,q){
  const c=cardEntry(key)||{ef:2.5,ivl:0,reps:0};
  if(q===0) return 0; // revient dans la session
  if(q===1) return Math.max(1,Math.round((c.ivl||1)*0.6));
  if(q===2) return c.reps===0?1 : c.reps===1?4 : Math.round(c.ivl*c.ef);
  return c.reps===0?3 : Math.round(Math.max(4,c.ivl)*c.ef*1.3);
}
function ivlLabel(d){ return d===0?"dans 3 cartes" : d===1?"demain" : d<30?d+" j" : Math.round(d/30*10)/10+" mois"; }
function rateCardEntry(key,q){
  let c=S.cards[key];
  if(!c) c=S.cards[key]={ef:2.5,ivl:0,reps:0,due:today(),lapses:0,seen:0};
  c.seen++;
  const ivl=nextIvl(key,q);
  if(q===0){ c.lapses++; c.reps=0; c.ivl=0; c.ef=Math.max(1.3,c.ef-0.2); c.due=addDays(1); }
  else if(q===1){ c.ef=Math.max(1.3,c.ef-0.15); c.ivl=ivl; c.due=addDays(fuzz(ivl)); }
  else if(q===2){ c.reps++; c.ivl=ivl; c.due=addDays(fuzz(ivl)); }
  else { c.reps++; c.ef=Math.min(2.8,c.ef+0.15); c.ivl=ivl; c.due=addDays(fuzz(ivl)); }
}
function isLeech(key){ const c=cardEntry(key); return c&&c.lapses>=4; }
function cardsDue(){
  const t=today(), out=[];
  FLASHCARDS.forEach(c=>{
    if(S.cards[c.id]&&S.cards[c.id].due<=t) out.push({id:c.id,rev:false});
    if(S.cards[c.id+":r"]&&S.cards[c.id+":r"].due<=t) out.push({id:c.id,rev:true});
  });
  return out;
}
function cardsNewPool(pool){
  // endroits jamais vus, puis envers dont l'endroit est appris
  const fresh=pool.filter(c=>!S.cards[c.id]).map(c=>({id:c.id,rev:false}));
  const revs=pool.filter(c=>{const f=S.cards[c.id]; return f&&f.reps>=1&&!S.cards[c.id+":r"];}).map(c=>({id:c.id,rev:true}));
  return [...fresh,...revs];
}
function cardsMastered(){ return Object.values(S.cards).filter(c=>(c.ivl||0)>=21).length; }
function cardsForecast(days){
  // nb de cartes qui tomberont dues d'ici N jours (au-delà d'aujourd'hui)
  const lim=addDays(days), t=today();
  return Object.values(S.cards).filter(c=>c.due>t&&c.due<=lim).length;
}
function revLabel(e){
  if(e.t==="deal"){const d=DEALS.find(x=>x.id===e.id); return d?["📖","Deal — "+d.title]:null;}
  if(e.t==="lesson"){const l=LESSONS.find(x=>x.id===e.id); return l?["🎓","Leçon — "+l.title]:null;}
  if(e.t==="case"){const c=CASES.find(x=>x.id===e.id); return c?["🪑","Cas DAF — "+c.title]:null;}
  if(e.t==="nego"){const n=NEGOS.find(x=>x.id===e.id); return n?["🤺","Négo — "+n.title]:null;}
  if(e.t==="teaser"){const x=TEASERS.find(y=>y.id===e.id); return x?["🧠","Teaser — "+x.cat]:null;}
  if(e.t==="cascade"){const x=CASCADES.find(y=>y.id===e.id); return x?["📊","Cascade — "+x.title]:null;}
  if(e.t==="plbo"){const x=PLBO.find(y=>y.id===e.id); return x?["🧾","Paper LBO — "+x.title]:null;}
  if(e.t==="feyn"){const x=FEYNMAN.find(y=>y.id===e.id); return x?["🧒","Feynman — "+x.title]:null;}
  if(e.t==="mclass"){const x=MASTERCLASS.find(y=>y.id===e.id); return x?[x.icon,"Masterclass — "+x.domain]:null;}
  if(e.t==="eco"){const x=ECO_CHAPITRES.find(y=>y.id===e.id); return x?[x.icon,"Éco — "+x.titre]:null;}
  return null;
}
function openRev(t,id){
  if(t==="deal") return dealQuiz(id);
  if(t==="mclass") return mcQuiz(id);
  if(t==="eco") return chapitreQuiz(id);
  if(t==="lesson") return lessonQuiz(id);
  if(t==="teaser") return openTeaser(id);
  if(t==="feyn") return openFeyn(id);
  return openSpar(t,id);
}

// ================= ERREURS / RATTRAPAGE =================
function recMiss(base){ if(!S.miss.includes(base)) S.miss.push(base); }
function missItems(){
  const out=[];
  for(const m of S.miss){
    const [k,id,qi]=m.split("|");
    const src=k==="D"?DEALS.find(d=>d.id===id):k==="M"?MASTERCLASS.find(x=>x.id===id):k==="E"?ECO_CHAPITRES.find(x=>x.id===id):LESSONS.find(l=>l.id===id);
    const label=k==="D"?"Deal — "+(src?src.title:""):k==="M"?"Masterclass — "+(src?src.domain:""):k==="E"?"Éco — "+(src?src.titre:""):"Leçon — "+(src?src.title:"");
    if(src&&src.questions[qi]) out.push({ref:m,q:src.questions[qi],from:label});
  }
  return out;
}

// ================= MENU DU JOUR =================
function nextUndone(list,doneIds){ return list.find(x=>!doneIds.includes(x.id))||list[Math.floor(Math.random()*list.length)]; }
function ensureMenu(){
  const t=today();
  if(S.menu&&S.menu.date===t){
    if(S.menu.dCards===undefined){ S.menu.dCards=false; save(); } // migration des menus d'avant l'ajout des flashcards
    if(S.menu.readMode===undefined){ S.menu.readMode="deal"; if(!S.menu.mclass) S.menu.mclass=nextUndone(MASTERCLASS,S.done.mclass).id; save(); } // migration masterclass
    return;
  }
  const doy=Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/864e5);
  const sparType=SPARROT[doy%SPARROT.length];
  // La "lecture du jour" alterne : 2 jours sur 3 un deal, 1 jour sur 3 une masterclass sectorielle
  const readMode=(doy%3===2)?"mclass":"deal";
  S.menu={date:t,readMode,deal:nextUndone(DEALS,S.done.deals).id,mclass:nextUndone(MASTERCLASS,S.done.mclass).id,
    lesson:nextUndone(LESSONS,S.done.lessons).id,
    sparType,spar:nextUndone(SPAR[sparType].l(),SPAR[sparType].d()).id,dDeal:false,dLesson:false,dSpar:false,dCards:false,validated:false};
  save();
}
function checkMenu(kind,id){
  const m=S.menu; if(!m||m.date!==today()) return;
  if(kind==="deal"&&id===m.deal) m.dDeal=true;
  if(kind==="mclass"&&id===m.mclass) m.dDeal=true; // la masterclass valide le slot "lecture du jour"
  if(kind==="lesson"&&id===m.lesson) m.dLesson=true;
  if(kind==="cards") m.dCards=true;
  if(SPAR[kind]&&kind===m.sparType&&id===m.spar) m.dSpar=true;
  if(m.dDeal&&m.dLesson&&m.dSpar&&m.dCards&&!m.validated){
    m.validated=true;
    S.streak=(S.lastVal===yesterday())?S.streak+1:1;
    S.lastVal=today();
    if(!S.days.includes(today())) S.days.push(today());
    addXP(20);
    setTimeout(()=>toast("🔥 <b>Journée validée.</b> Streak : "+S.streak+" (+20 XP)"),400);
  }
  save(); header();
}

// ================= LA BOÎTE — MOTEUR =================
const IS_RATE=.25, OD_RATE=.12, FACTOR_FEE=.025;

// Tous les cas, tous niveaux confondus. Le filtrage se fait sur .lvl.
function allCases(){
  // Les decks des niveaux 2 et 3 ont été écrits le 2026-09-20 : jusque-là,
  // jouer en niveau 2 ou 3 servait le deck artisan sur 48 ou 60 mois.
  return BIZCASES
    .concat(typeof BIZCASES_N1!=="undefined"?BIZCASES_N1:[])
    .concat(typeof BIZCASES_N2!=="undefined"?BIZCASES_N2:[])
    .concat(typeof BIZCASES_N3!=="undefined"?BIZCASES_N3:[]);
}
function bizCase(id){ return allCases().find(c=>c.id===id); }
function niveau(n){ return NIVEAUX.find(x=>x.n===n)||NIVEAUX[0]; }

// Mensualité d'un prêt amortissable classique (annuités constantes).
function loanPayment(amount,rate,months){
  const r=rate/12;
  return months<=0?0:(r>0 ? amount*r/(1-Math.pow(1+r,-months)) : amount/months);
}

function eur(n){
  n=Math.round(n);
  const s=Math.abs(n)>=10000 ? (n/1000).toFixed(1).replace(".",",")+" k€" : n.toLocaleString("fr-FR")+" €";
  return s;
}
function bizSector(){ return SECTORS.find(s=>s.id===S.biz.sector); }

function bizNew(sectorId,name,level){
  const sec=SECTORS.find(s=>s.id===sectorId);
  const N=niveau(level||1);
  // Démarrage en régime établi : stock déjà constitué et crédit fournisseur déjà en place.
  // Sinon le mois 1 fabrique un faux afflux de cash (dettes fournisseurs surgies de rien).
  const q0=sec.a-sec.b*sec.p0;
  const stock0=q0*1*sec.mc;          // 1 mois de stock
  const ap0=q0*sec.mc*(45/30);       // crédit fournisseur en régime
  const cash0=12000;
  S.biz={
    name, sector:sectorId, emoji:sec.emoji, unitLabel:sec.unit,
    level:N.n, horizon:N.duree, finished:false,
    month:0, alive:true, over:null,
    loans:[], capacity:1, staff:0, badDebt:0,
    price:sec.p0, mc:sec.mc, fc:sec.fc,
    stockTarget:1, dso:0, dpo:45, b2bShare:0, b2b:false,
    demandMult:1, growth:1, compFactor:1, rep:1,
    cash:cash0, startCash:cash0,
    stockU:q0, qPrev:q0, ar:0, ap:ap0, debt:0,
    capital:cash0+stock0-ap0, reserves:0,   // le bilan équilibre : actif = passif
    hist:[], seen:[], pending:null, answers:[],
    rupturesTot:0, lastRupture:0, lastSold:0, lastPurch:0,
    elast:0, est60:0, bfr:stock0-ap0,
    mkt:mktInit(), seed:Math.floor(Math.random()*1e9), jx:jxInit(), jalons:[]
  };
  save();
}

// Élasticité au point de prix : e = -b·P / (a - b·P). Elle bouge quand le prix bouge.
/* ================================================================
   LE MARCHÉ — ajouté le 2026-09-21, sur « mets plus de challenge,
   d'imprévisible, l'élasticité ne change pas vraiment ».
   Il avait raison : a et b sont des constantes de secteur que RIEN
   ne modifiait. L'élasticité n'était fonction que du prix qu'il
   fixait lui-même — donc le prix optimal se calculait au mois 1 et
   ne bougeait plus de 48 mois. Le seul aléa était un bruit ±12 %
   symétrique dont le commentaire disait « le bruit ne tue pas ».
   Désormais la COURBE elle-même bouge :
   · un régime de marché qui change (expansion / normal / tension /
     crise), avec ses propres probabilités de transition ;
   · une dérive lente et continue de la taille du marché et de la
     sensibilité au prix ;
   · des CHOCS exogènes, asymétriques, sans signal préalable.
   Garde-fou unique : il existe toujours un prix rentable
   (prix d'étranglement maintenu au-dessus du coût de revient),
   sinon l'aléa ne serait plus un risque mais une condamnation. */
const MKT_REGIMES = {
  boom:    {nom:"Expansion",  ic:"📈", aM:1.18, cM:1.12, col:"#1fc584",
            desc:"Le marché tire. Les clients regardent moins l'étiquette."},
  normal:  {nom:"Normal",     ic:"➖", aM:1.00, cM:1.00, col:"#8a94ab",
            desc:"Rien de particulier. Profites-en pour regarder tes chiffres."},
  tension: {nom:"Tension",    ic:"⚠️", aM:0.93, cM:0.93, col:"#d6b25e",
            desc:"Les volumes s'essoufflent et les clients comparent."},
  crise:   {nom:"Crise",      ic:"🔻", aM:0.80, cM:0.84, col:"#f4506a",
            desc:"Le marché se contracte et devient très sensible au prix."}
};
/* Transitions mensuelles. Durées moyennes visées : 8-10 mois en normal,
   4-6 en tension, 3-5 en crise — il doit en traverser deux ou trois
   sur une partie de 48 mois, sans que ce soit un métronome. */
const MKT_TRANS = {
  boom:    [["normal",.16],["tension",.05]],
  normal:  [["tension",.07],["boom",.05]],
  tension: [["crise",.10],["normal",.18],["boom",.02]],
  crise:   [["tension",.24],["normal",.04]]
};
function mktInit(){ return {regime:"normal", since:0, aMult:1, bMult:1, chocs:[], news:[], vus:[]}; }
function mkt(B){ B=B||S.biz; if(!B) return mktInit(); if(!B.mkt) B.mkt=mktInit(); return B.mkt; }
function mktReg(B){ return MKT_REGIMES[mkt(B).regime] || MKT_REGIMES.normal; }
/* Multiplicateurs effectifs = régime × dérive × chocs actifs. */
/* ---- LE BON PARAMÉTRAGE, et c'est ce qui a tout débloqué ----
   Sur une demande linéaire Q = a − bP, l'élasticité au prix P vaut
   −P / (Pc − P) où Pc = a/b est le prix d'étranglement. Elle ne dépend
   donc QUE DE Pc, jamais de la pente b. Première version : je faisais
   bouger a et b indépendamment, leur rapport variait du simple au
   quadruple, et l'élasticité partait de 12x sur une partie — un autre
   métier tous les six mois, pas un marché qui bouge.
   On pilote donc les deux grandeurs qui ont un sens économique :
   · le PRIX D'ÉTRANGLEMENT, qui porte l'élasticité ET le prix optimal ;
   · la TAILLE du marché (la pente), qui porte les volumes sans toucher
     à l'élasticité.
   Un choc qui rendait la clientèle « plus sensible au prix » (bM > 1)
   fait donc BAISSER le prix d'étranglement, ce qui est la même chose
   dite correctement. */
/* La TURBULENCE dépend du niveau, et c'est cohérent avec la philosophie
   des trois paliers : « aide maximale » à l'artisan, « aucun garde-fou »
   au dealmaker. Un même moteur, trois duretés. Mesuré sur 30 parties par
   niveau : sans ce réglage, le niveau 1 tuait 23 % des joueurs attentifs
   alors qu'il est censé être le palier où l'on apprend. */
function mktInt(B){ return [0,.50,1,1.35][(B&&B.level)||1] || 1; }
function bl(x,k){ return 1+((x||1)-1)*k; }   /* rapproche un multiplicateur de 1 */
function mktSize(B){ const m=mkt(B), k=mktInt(B);
  return bl(m.aMult,k)*bl(mktReg(B).aM,k)*m.chocs.reduce((t,c)=>t*bl(c.aM,k),1); }
function mktChoke(B){ const m=mkt(B), k=mktInt(B);
  return bl(m.bMult,k)*bl(mktReg(B).cM,k)*m.chocs.reduce((t,c)=>t/bl(c.bM,k),1); }
function curveB(B){ B=B||S.biz; return bizSector().b * mktSize(B); }
function curveChoke(B){ B=B||S.biz;
  const s=bizSector(), brut=s.choke*mktChoke(B);
  /* Bornes : le marché peut devenir très dur, il ne devient jamais
     impossible — il reste toujours un prix qui gagne de l'argent. */
  const bas=Math.max(B.mc*1.30, s.choke*.74), haut=s.choke*1.38;
  return Math.min(haut, Math.max(bas, brut));
}
function curveA(B){ B=B||S.biz; return curveB(B)*curveChoke(B); }
/* Le tour de marché : dérive, régime, expiration et tirage des chocs.
   Appelé au tout début du mois, AVANT que la demande ne soit calculée. */
function mktTurn(B){
  const m=mkt(B);
  m.news=[];
  /* 1. dérive lente et continue — rien n'est jamais tout à fait stable */
  const g=()=> (Math.random()+Math.random()+Math.random()-1.5)/1.5;   /* ~ loi normale, bornée */
  /* AR(1) avec RAPPEL VERS 1, pas une marche aléatoire libre : sans le rappel,
     la dérive partait aux bornes et y restait — mesuré sur 40 parties,
     l'élasticité variait de 12,8× et le prix optimal de 130 %, ce qui ne fait
     plus un marché mouvant mais un autre métier tous les six mois. Avec
     phi = 0,97 l'écart-type stationnaire tourne autour de 8 %, et les régimes
     et les chocs se superposent par-dessus. */
  m.aMult=Math.min(1.40,Math.max(.72, 1+(m.aMult-1)*.97+g()*.022));   /* taille du marché */
  m.bMult=Math.min(1.22,Math.max(.84, 1+(m.bMult-1)*.96+g()*.013));   /* prix d'étranglement */
  /* 2. les chocs actifs vieillissent */
  m.chocs.forEach(c=>c.left--);
  const finis=m.chocs.filter(c=>c.left<=0);
  finis.forEach(c=>{
    /* un choc qui a modifié une VALEUR (coût de revient, découvert) doit
       pouvoir la rendre : sinon le message de fin ment sur ses effets */
    const def=(typeof MKT_CHOCS!=="undefined"?MKT_CHOCS:[]).find(x=>x.id===c.id);
    if(def&&def.onFin){ try{ def.onFin(B); }catch(e){} }
    if(c.fin) m.news.push({t:"🕊️ "+c.fin, k:"fin"});
  });
  m.chocs=m.chocs.filter(c=>c.left>0);
  /* 3. le régime peut basculer */
  m.since++;
  if(m.since>=3){
    let r=Math.random();
    for(const [vers,p] of (MKT_TRANS[m.regime]||[])){
      if(r<p){ m.regime=vers; m.since=0;
        m.news.push({t:MKT_REGIMES[vers].ic+" <b>"+MKT_REGIMES[vers].nom+"</b> — "+MKT_REGIMES[vers].desc, k:"regime"});
        break; }
      r-=p;
    }
  }
  /* 4. un choc, peut-être. Sans signal préalable : c'est la promesse
     écrite du niveau 2 (« les événements arrivent sans signal »). */
  if(B.month>=4 && Math.random()<.10*mktInt(B)+.05){
    const dispo=(typeof MKT_CHOCS!=="undefined"?MKT_CHOCS:[]).filter(c=>
      !m.vus.includes(c.id) && (c.lvl||1)<=B.level && (!c.when||c.when(B)));
    if(dispo.length){
      const c=dispo[Math.floor(Math.random()*dispo.length)];
      m.vus.push(c.id);
      const actif={id:c.id, left:c.duree||1, aM:c.aM, bM:c.bM, fin:c.fin};
      if(c.aM||c.bM) m.chocs.push(actif);
      if(c.apply) c.apply(B);
      m.news.push({t:c.ic+" <b>"+c.titre+"</b> — "+c.texte(B), k:"choc"});
    }
  }
  return m.news;
}
function bizElast(price){
  const B=S.biz, A=curveA(B), bb=curveB(B), q=A-bb*price;
  return q>0 ? -(bb*price)/q : -99;
}
// Demande de base sur la courbe, avant les multiplicateurs (qui ne changent pas l'élasticité).
function bizDemand(price,noise){
  const B=S.biz, sec=bizSector();
  const season=sec.season[B.month%12];
  // Bruit ±12 % : une demande réelle n'est jamais lisse. C'est CONTRE ce bruit qu'un
  // stock de sécurité existe — sans lui, le stock ne serait que du cash gaspillé.
  // Aucune injustice : le bruit ne tue pas, il fait payer l'imprudence.
  const n=noise===undefined?1:noise;
  return Math.max(0, Math.round((curveA(B)-curveB(B)*price)*B.rep*season*B.demandMult*B.compFactor*n));
}


/* ---------- LE BILAN, ENFIN COMPLET ----------
   Il manquait TROIS lignes, et l'app affichait tranquillement un bilan
   déséquilibré :
   · ACTIF  — les immobilisations (B.capex existait, n'était affiché nulle part :
              acheter la machine sortait le cash et l'actif s'évaporait)
   · ACTIF  — le fonds de commerce d'une acquisition
   · PASSIF — les emprunts (B.debt existait, n'était affiché nulle part)
   Le moteur mensuel, lui, est juste : ΔCash = RN − ΔBFR − loanCap et
   réserves += RN maintiennent l'identité à la perfection. Ce sont les
   apply() des cas qui bougent le cash sans contrepartie. */
/* La dette RÉELLE se lit dans les emprunts, jamais dans B.debt — qui n'est
   recalculé qu'au tour suivant. Un cas qui pousse un emprunt (n1saison) sans
   toucher B.debt créait sinon une fausse recette : le rééquilibrage voyait du
   cash sans contrepartie et le passait en BÉNÉFICE, puis bizTurn découvrait la
   dette. L'emprunt se retrouvait compté deux fois au passif. */
/* Fabrique un emprunt AU FORMAT DU MOTEUR. Sans pay/principalLeft, la boucle
   de service de la dette calcule undefined − … = NaN, et le résultat, la
   trésorerie et les réserves partent en NaN en silence. */
function mkLoan(amount,rate,months,label){
  return {label:label||"Emprunt", amount, rate, months, left:months,
          principalLeft:amount, pay:loanPayment(amount,rate,months)};
}
function bizDebtOf(B){
  return (B.loans||[]).reduce((t,l)=>
    t+Math.max(0, l.principalLeft!==undefined ? l.principalLeft : (l.amount||0)), 0);
}
/* ---------- EBITDA vs EBIT : la distinction que le niveau 2 enseigne ----------
   Le moteur calcule ebitda = marge brute − charges fixes. Or la DOTATION AUX
   AMORTISSEMENTS est poussée DANS les charges fixes (B.fc += … + dotM, cas
   n1machine et n2levier). Donc le champ stocké h.ebitda est en réalité un
   EBIT : dès qu'une machine est achetée, il est minoré de la dotation.
   Conséquence concrète : le ratio dette nette / EBITDA du cas n2covenant
   sortait TROP ÉLEVÉ, dans le niveau même qui apprend à le lire.
   On ne touche pas au moteur (ses maths sont justes, et dot est déjà remis
   au cash) : on corrige les LECTURES. Avant tout achat, dot = 0 et rien ne
   bouge — le correctif ne mord que là où le chiffre était faux. */
function ebM(h){ return h ? ((h.ebitda||0) + (h.dot||0)) : 0; }   /* EBITDA du mois, avant dotations */
function ebitM(h){ return h ? (h.ebitda||0) : 0; }                /* EBIT du mois, après dotations */
function eb12Of(B){ return (B&&B.hist ? B.hist.slice(-12) : []).reduce(function(t,h){return t+ebM(h);},0); }
function fcCash(B){ return Math.max(0,(B.fc||0)-(B.amortM||0)); }  /* charges fixes réellement décaissées */
function bizBalance(B){
  B=B||S.biz; if(!B) return null;
  const immo=Math.max(0,(B.capex||0)-(B.amort||0));
  const gw=B.goodwill||0;
  const stock=B.stockU*B.mc;
  const debt=bizDebtOf(B);
  const actif=Math.max(0,B.cash)+stock+B.ar+immo+gw;
  const passif=B.capital+B.reserves+B.ap+Math.max(0,-B.cash)+debt;
  return {immo,gw,stock,debt,actif,passif,ecart:actif-passif};
}
/* Un cas peut sortir du cash sans rien mettre en face (une machine, un rachat,
   un impayé). Économiquement, du cash parti sans actif en face EST une charge :
   on passe donc l'écart par le résultat. L'identité redevient vraie, et elle
   le reste. */
/* Garde-fou : un cas pouvait retirer plus de charges fixes qu'il n'y en a
   (n2concentration faisait B.fc -= 7500 sur une base de 3 500). Des charges
   fixes négatives s'ajoutent à l'EBITDA : de l'argent gratuit, à vie. */
function fcGuard(B){ B=B||S.biz; if(B && B.fc<200) B.fc=200; }
function bizRebalance(){
  fcGuard();
  if(S.biz) S.biz.debt=bizDebtOf(S.biz);   /* on synchronise AVANT de juger l'écart */
  const b=bizBalance(); if(!b) return 0;
  if(Math.abs(b.ecart)>0.5){ S.biz.reserves+=b.ecart; return b.ecart; }
  return 0;
}

function bizTurn(){
  const B=S.biz, sec=bizSector();
  if(!B.alive||B.pending) return;
  const bfrPrev=B.stockU*B.mc + B.ar - B.ap;
  B.month++;
  const news=mktTurn(B);   /* le marché bouge AVANT que la demande ne se calcule */

  // La chaîne étend son référencement : la croissance est CONTINUE, donc le ΔBFR l'est aussi.
  // C'est la croissance soutenue qui tue, pas un palier unique — qui, lui, se digère.
  if(B.growth>1) B.demandMult=Math.min(3.5,B.demandMult*B.growth);

  const q=bizDemand(B.price, .88+Math.random()*.24);
  B.elast=bizElast(B.price);

  // Production sur PRÉVISION (le mois dernier), pas sur la demande réelle du mois :
  // une entreprise ne connaît pas sa demande à l'avance. C'est ce qui rend les ruptures
  // possibles — et donc le stock de sécurité réellement utile.
  // La capacité de production plafonne ce qu'on peut fabriquer : c'est ce qui
  // donne son sens au recrutement et à la sous-traitance.
  const capQ=Math.round((sec.a-sec.b*sec.p0)*(B.capacity||1)*1.8);
  const prod=Math.max(0, Math.min(capQ, Math.round(B.qPrev*(1+B.stockTarget) - B.stockU)));
  const avail=B.stockU+prod;
  const sold=Math.min(q,avail);
  const rupture=q-sold;
  B.stockU=avail-sold;
  B.lastSold=sold; B.lastRupture=rupture; B.qPrev=q;
  if(rupture>0){ B.rupturesTot++; B.rep=Math.max(.6,B.rep-.04); }
  else B.rep=Math.min(1.25,B.rep+.01);

  // CA (l'escompte accordé au client ampute le CA sur la part B2B)
  const ca=sold*B.price*(1-(B.escompteClient||0)*B.b2bShare);
  const cogs=sold*B.mc;
  const purch=prod*B.mc;
  B.lastPurch=purch;

  // Créances et dettes ne SAUTENT pas à leur cible : elles s'y relâchent.
  // Un poste client à 60 j met deux mois à se constituer ; un passage au comptant ne
  // fait pas s'évaporer les factures déjà émises — elles s'éteignent à leur terme.
  const creditCA=ca*B.b2bShare*(1-(B.acompte||0));
  const arTarget=creditCA*(B.dso/30);
  const apTarget=purch*(B.dpo/30);
  B.ar += (arTarget-B.ar)*.5;
  B.ap += (apTarget-B.ap)*.5;

  // compte de résultat
  const mb=ca-cogs;
  const ebitda=mb-B.fc;
  const interest=(B.cash<0 ? -B.cash*OD_RATE/12 : 0);
  const factorFee=B.factor ? creditCA*FACTOR_FEE : 0;
  // Les emprunts : seuls les INTÉRÊTS passent au compte de résultat.
  // Le capital remboursé sort du cash sans jamais toucher le résultat —
  // c'est le coeur du malentendu résultat / trésorerie.
  let loanInt=0, loanCap=0;
  (B.loans||[]).forEach(l=>{
    if(l.principalLeft===undefined) l.principalLeft=l.amount;
    if(l.principalLeft<=.01) return;
    const it=l.principalLeft*l.rate/12;
    const cp=Math.min(l.principalLeft, Math.max(0,l.pay-it));
    l.principalLeft-=cp; loanInt+=it; loanCap+=cp; l.left=Math.max(0,(l.left||0)-1);
  });
  B.debt=(B.loans||[]).reduce((t,l)=>t+Math.max(0,l.principalLeft||0),0);
  const rcai=ebitda-interest-factorFee-loanInt;
  const is=Math.max(0,rcai*IS_RATE);
  const rn=rcai-is;

  // trésorerie — identité comptable démontrée : ΔCash = RN − ΔBFR
  // (car ΔCash = CA − ΔBFR − COGS − FC − intérêts − IS, et RN = CA − COGS − FC − intérêts − IS)
  const bfr=B.stockU*B.mc + B.ar - B.ap;
  const dbfr=bfr-bfrPrev;
  /* LA DOTATION AUX AMORTISSEMENTS EST UNE CHARGE SANS DÉCAISSEMENT.
     Elle est déjà dans fc, donc déjà dans rn : il faut la REMETTRE au cash,
     sinon la machine est payée deux fois — une fois à l'achat, puis un
     soixantième par mois. C'est exactement la distinction charge/décaissement
     que le niveau 2 est censé enseigner ; autant que le moteur la respecte. */
  const dot = (B.capex && (B.amort||0) < B.capex) ? Math.min(B.amortM||0, B.capex-(B.amort||0)) : 0;
  const dcash=rn-dbfr-loanCap+dot;
  B.cash+=dcash;
  B.bfr=bfr;
  B.reserves+=rn;

  /* La machine est amortie : sa dotation était déjà dans les charges fixes
     (donc déjà dans le résultat, donc déjà dans les réserves). Il faut que
     l'ACTIF baisse du même montant, sinon le bilan se déséquilibre un peu
     plus chaque mois. Et quand elle est totalement amortie, la charge doit
     s'arrêter — sans ça les réserves continueraient à baisser toutes seules. */
  if(dot>0){
    B.amort=(B.amort||0)+dot;
    if(B.amort>=B.capex-.01){ B.fc=Math.max(0,B.fc-B.amortM); B.amortM=0; }
  }

  B.hist.push({m:B.month,ca:Math.round(ca),ebitda:Math.round(ebitda),rn:Math.round(rn),dot:Math.round(dot),
    cash:Math.round(B.cash),bfr:Math.round(bfr),dbfr:Math.round(dbfr),dcash:Math.round(dcash),
    sold,rupture,price:B.price,elast:B.elast,loanCap:Math.round(loanCap),loanInt:Math.round(loanInt)});

  // cessation de paiements
  // facilité de caisse minimale d'office ; le découvert négocié (cas bc2) la quadruple
  const odLimit=B.overdraftOk ? B.fc*2 : B.fc*.5;
  if(B.cash < -odLimit){ B.alive=false; B.over="cessation"; save(); return; }

  // Fin de parcours : on ne joue pas à l'infini, on rend des comptes.
  if(B.month>=B.horizon){ B.finished=true; save(); return; }

  jxTurn(B);      /* les compteurs de jalons, puis les déblocages */
  bizFireCase();
  save();
}

/* Retard d'éligibilité : déterministe pour une partie donnée (sinon un cas
   pourrait avancer et reculer d'un mois sur l'autre), différent d'une
   partie à l'autre grâce à B.seed. */
function caseDelay(B,id){
  let h=(((B&&B.seed)||1)^0x9e3779b9)>>>0;
  for(let i=0;i<id.length;i++) h=Math.imul(h^id.charCodeAt(i),2654435761)>>>0;
  h^=h>>>15; h=Math.imul(h,2246822507)>>>0;
  return (h>>>0)%6;
}
/* ================================================================
   LES JALONS — la boucle courte qui manquait.
   Une partie de niveau 2 dure 48 tours et la note n'arrivait qu'au
   dernier : aucun objectif intermédiaire, rien à battre, aucune
   trace de ce qu'on avait réussi. B.jx tient les compteurs, jxTurn
   les met à jour chaque mois, jalonCheck débloque.
   Un jalon décroché ne se reperd jamais. */
function jxInit(){ return {maxMoisCash:0, moisMarge10:0, moisCashOk:0, moisCovenantOK:0,
  moisBienPrice:0, crisesTenues:0, reprixRapides:0, chocsEncaisses:0, maxSerie:0,
  etatsParfaits:0, croissanceMax:1, aEteDecouvert:false, hausseEnBoom:false,
  etatParfait:false, enCrise:false, crisePropre:true, dernierRegime:"normal",
  moisChangeRegime:-9, chocEnCours:null, prevPrice:null, noteFinale:0}; }
function jx(B){ B=B||S.biz; if(!B) return jxInit(); if(!B.jx) B.jx=jxInit(); return B.jx; }
/* La série de décisions se LIT dans B.answers : pas besoin de la tenir à
   jour dans les quatre endroits qui enregistrent une réponse. */
function serieActuelle(B){
  const a=(B.answers||[]).filter(x=>x.q!==undefined);
  let k=0; for(let i=a.length-1;i>=0;i--){ if(a[i].q>=2) k++; else break; }
  return k;
}
function serieMax(B){
  const a=(B.answers||[]).filter(x=>x.q!==undefined);
  let k=0,m=0; a.forEach(x=>{ if(x.q>=2){ k++; m=Math.max(m,k); } else k=0; });
  return m;
}
function jxTurn(B){
  const J=jx(B), h=B.hist[B.hist.length-1], m=mkt(B);
  if(!h) return;
  if(B.cash<0) J.aEteDecouvert=true;
  if(B.fc>0) J.maxMoisCash=Math.max(J.maxMoisCash, B.cash/B.fc);
  /* marge nette et flux d'exploitation, en mois CONSÉCUTIFS */
  J.moisMarge10 = (h.ca>0 && h.rn/h.ca>.10) ? J.moisMarge10+1 : 0;
  J.moisCashOk  = ((h.rn+(h.dot||0)-h.dbfr)>0) ? J.moisCashOk+1 : 0;
  /* covenant : il faut de la dette ET douze mois d'EBITDA derrière soi */
  const eb12=eb12Of(B);
  J.moisCovenantOK = (B.hist.length>=12 && (B.debt||0)>0 && eb12>0 && (B.debt/eb12)<2.5)
    ? J.moisCovenantOK+1 : 0;
  /* le prix, tenu près de l'optimum */
  const pstar=(curveChoke(B)+B.mc)/2;
  J.moisBienPrice = (pstar>0 && Math.abs(B.price-pstar)/pstar<.08) ? J.moisBienPrice+1 : 0;
  /* traversée de crise : propre si on n'a jamais été à découvert dedans */
  if(m.regime==="crise"){ if(!J.enCrise){ J.enCrise=true; J.crisePropre=true; } if(B.cash<0) J.crisePropre=false; }
  else if(J.enCrise){ J.enCrise=false; if(J.crisePropre) J.crisesTenues++; }
  /* changement de régime : on note le mois, pour juger la réactivité du prix */
  if(m.regime!==J.dernierRegime){ J.dernierRegime=m.regime; J.moisChangeRegime=B.month; }
  /* un coup dur : on photographie la trésorerie, on regarde si elle revient */
  const coup=(m.news||[]).some(x=>x.k==="choc");
  if(coup && !J.chocEnCours) J.chocEnCours={cash:B.cash, mois:B.month};
  if(J.chocEnCours){
    if(B.month-J.chocEnCours.mois>6) J.chocEnCours=null;
    else if(B.month>J.chocEnCours.mois && B.cash>=J.chocEnCours.cash){ J.chocsEncaisses++; J.chocEnCours=null; }
  }
  /* croissance : meilleur rapport 12 derniers mois / 12 premiers atteint */
  if(B.hist.length>=13){
    const d=B.hist.slice(-12).reduce((t,x)=>t+x.ca,0), p=B.hist.slice(0,12).reduce((t,x)=>t+x.ca,0);
    if(p>0) J.croissanceMax=Math.max(J.croissanceMax, d/p);
  }
  J.maxSerie=Math.max(J.maxSerie, serieMax(B));
  if(B.finished){ const V=bizVerdict(); J.noteFinale=V.tot; }
  jalonCheck(B);
}
function jalonsDe(B){ return (typeof JALONS!=="undefined"?JALONS:[]).filter(j=>(j.lvl||1)<=B.level); }
function jalonCheck(B){
  B=B||S.biz; if(!B) return;
  if(!B.jalons) B.jalons=[];
  jx(B);
  jalonsDe(B).forEach(j=>{
    if(B.jalons.includes(j.id)) return;
    let ok=false; try{ ok=!!j.ok(B); }catch(e){}
    if(ok){
      B.jalons.push(j.id);
      addXP(j.xp);
      setTimeout(()=>toast(j.ic+" <b>"+j.nom+"</b> — jalon décroché, +"+j.xp+" XP"),300);
    }
  });
  save();
}
function bizFireCase(){
  const B=S.biz;
  /* On ne prenait que le PREMIER du tableau : l'ordre des cas était donc
     rigoureusement identique d'une partie à l'autre — « tu me ressors les
     mêmes choses qu'hier ». On tire au sort parmi tous les cas éligibles,
     avec un poids 3 pour ceux du niveau en cours (sans quoi un joueur de
     niveau 2 rejoue surtout le deck artisan). Les cas « build » restent
     ordonnés entre eux : ce sont leurs propres gardes qui l'imposent
     (n2tft exige n2cr vu, n2bilan exige n2tft vu). */
  const elig=allCases().filter(x=>!B.seen.includes(x.id) && (x.lvl||1)<=B.level && x.when(B));
  if(!elig.length) return;
  /* Le tirage au sort ne suffisait pas : dans les premiers mois, les gardes
     « month >= X » ne laissent souvent qu'UN candidat éligible, donc les
     trois premiers cas étaient identiques dans les six parties testées.
     On mémorise le mois où chaque cas devient éligible et on lui impose un
     retard de 0 à 5 mois, propre à la partie ET au cas. Deux parties
     divergent donc dès le premier mois. Filet : si le retard écarte tout
     le monde, on reprend la liste complète — le jeu ne cale jamais. */
  if(!B.elig) B.elig={};
  elig.forEach(x=>{ if(B.elig[x.id]===undefined) B.elig[x.id]=B.month; });
  const prets=elig.filter(x=>B.month-B.elig[x.id] >= caseDelay(B,x.id));
  /* Pas de filet ici : le filet « si personne n'est prêt, on prend toute la
     liste » annulait tout le dispositif, puisque le cas unique éligible
     des premiers mois repassait aussitôt devant. Un mois sans décision
     est un mois normal. Aucun risque de blocage : le retard est plafonné
     à 5 mois et l'éligibilité est réévaluée à chaque tour. */
  if(!prets.length) return;
  const pool=prets;
  const poids=x=>((x.lvl||1)===B.level?3:1);
  let tot=pool.reduce((t,x)=>t+poids(x),0), r=Math.random()*tot, c=pool[0];
  for(const x of pool){ r-=poids(x); if(r<=0){ c=x; break; } }
  B.pending=c.id;
  const lastCA=B.hist.length?B.hist[B.hist.length-1].ca:0;
  B.est60=lastCA*1.5*.45*2; // BFR estimé du contrat 60 j après croissance
}

  return `<div class="card">

      ${mn<0?`<line x1="0" y1="${y(0)}" x2="${W}" y2="${y(0)}" stroke="#e0563f55" stroke-dasharray="3 3"/>`:""}

// ---------- LE VERDICT DE FIN DE PARCOURS ----------
// Note globale sur cinq axes. Quatre sont financiers et se lisent dans le bilan ;
// le cinquième note la QUALITÉ des décisions, indépendamment du résultat obtenu.
// Un bon choix peut mal tourner, un mauvais choix peut passer : on note les deux séparément.
function bizVerdict(){
  const B=S.biz, H=B.hist, N=Math.min(12,H.length);
  const last12=H.slice(-12), first12=H.slice(0,12);
  const ca12=last12.reduce((t,h)=>t+h.ca,0);
  const caF=first12.reduce((t,h)=>t+h.ca,0);
  const rn12=last12.reduce((t,h)=>t+h.rn,0);
  const rnTot=H.reduce((t,h)=>t+h.rn,0);
  const eb12=last12.reduce((t,h)=>t+ebM(h),0);   /* EBITDA, pas EBIT : le levier se lit avant dotations */
  const marge=ca12>0?rn12/ca12:0;
  const crois=caF>0?ca12/caF:1;
  const moisCash=B.fc>0?B.cash/B.fc:0;
  const levier=eb12>0?(B.debt||0)/eb12:(B.debt>0?9:0);
  const qs=B.answers.filter(a=>a.q!==undefined).map(a=>a.q);
  const qMoy=qs.length?qs.reduce((t,x)=>t+x,0)/qs.length:0;

  // Barème volontairement dur : survivre est le minimum, pas une performance.
  // Le plus gros coefficient va à la QUALITÉ DU RAISONNEMENT, pas au résultat —
  // c'est la seule chose qui se transfère à la vraie vie.
  const ax=[
   {k:"Survie", pts:B.alive?20:0, max:20,
    txt:B.alive?"Tu es encore là au bout de "+B.horizon+" mois. C'est le minimum exigé, pas un exploit.":"Cessation de paiements. Tout le reste est théorique."},
   {k:"Rentabilité", pts:Math.round(Math.max(0,Math.min(1,(marge-.02)/.10))*20), max:20,
    txt:"Marge nette sur les 12 derniers mois : <b>"+(marge*100).toFixed(1)+" %</b>. Il faut dépasser <b>12 %</b> pour le maximum ; en dessous de <b>2 %</b>, tu travailles pour tes fournisseurs et tu ne touches aucun point."},
   {k:"Croissance", pts:Math.round(Math.max(0,Math.min(1,(crois-1)/1.0))*15), max:15,
    txt:"Ton CA de la dernière année vaut <b>"+crois.toFixed(2)+"×</b> celui de la première. Le maximum demande d'avoir <b>doublé</b> en trois ans."},
   {k:"Solidité", pts:Math.round(Math.max(0,Math.min(1,moisCash/6))*12 + Math.max(0,Math.min(1,(3.5-levier)/2.5))*8), max:20,
    txt:"Trésorerie finale : <b>"+moisCash.toFixed(1)+" mois</b> de charges fixes (il en faut <b>6</b> pour le maximum)"+(B.debt>0?" · dette / EBITDA : <b>"+levier.toFixed(1)+"×</b> — au-delà de 3,5×, une banque te ferme le robinet":"")+"."},
   {k:"Qualité des décisions", pts:Math.round(Math.max(0,Math.min(1,(qMoy+1)/2.5))*25), max:25,
    txt:"Moyenne de tes "+qs.length+" décisions : <b>"+qMoy.toFixed(2)+"</b> sur une échelle de −2 à +2. Il faut atteindre <b>+1,5</b> pour le maximum. Cet axe note ton <b>raisonnement</b>, pas ton résultat — un bon choix peut mal tourner, un mauvais peut passer."}
  ];
  const tot=ax.reduce((t,a)=>t+a.pts,0);
  const note = tot>=88?"A" : tot>=76?"B" : tot>=62?"C" : tot>=48?"D" : tot>=32?"E" : "F";
  const juge = !B.alive ? "Tu as coulé. Ce n'est pas une honte, c'est une facture — relis laquelle."
    : tot>=85 ? "Tu as fait tourner une vraie boîte, et tu sais pourquoi elle a tenu."
    : tot>=72 ? "Solide. Ce qui te manque n'est plus de la compréhension, c'est de la discipline sur deux ou trois décisions."
    : tot>=58 ? "Tu tiens, mais tu tiens en subissant. Regarde l'axe le plus bas : c'est toute ta marge de progression."
    : tot>=44 ? "Tu as survécu sans piloter. Les chiffres t'ont annoncé chaque problème et tu les as lus après coup."
    : "Tu as joué au commerçant, pas au dirigeant. Reprends les cas où ta note de décision est négative.";
  return {ax,tot,note,juge,marge,crois,moisCash,levier,qMoy,ca12,rnTot};
}

/* ---------- LA CALCULATRICE (à côté des décisions) ----------
   Les cas ne donnent JAMAIS la conséquence chiffrée : c'est à lui de
   l'estimer. Il n'avait aucun outil pour le faire sans quitter l'écran.
   Évaluation restreinte : la chaîne est validée caractère par caractère
   avant tout calcul, on n'évalue jamais du texte libre.
   Les chiffres de SA boîte sont insérables d'un doigt — c'est ce qui
   distingue cette calculatrice d'une calculatrice. */
let CALCMEM=[];
function calcFmt(v){
  if(!isFinite(v)) return "—";
  return Math.abs(v)>=1000
    ? v.toLocaleString("fr-FR",{maximumFractionDigits:2})
    : (Math.round(v*10000)/10000).toLocaleString("fr-FR",{maximumFractionDigits:4});
}
function calcEval(raw){
  let e=String(raw||"").trim();
  if(!e) return {v:null};
  e=e.replace(/\s+/g,"").replace(/,/g,".").replace(/[×✕]/g,"*").replace(/[÷]/g,"/").replace(/[−–—]/g,"-");
  e=e.replace(/(\d+(?:\.\d+)?)%/g,"($1/100)");          /* 20 % → 0,20 : 1200*20% = 240 */
  if(!/^[0-9+\-*/().]+$/.test(e)) return {err:"Seuls les chiffres et + − × ÷ ( ) % sont acceptés."};
  if((e.match(/\(/g)||[]).length!==(e.match(/\)/g)||[]).length) return {err:"Parenthèses non refermées."};
  try{
    const v=Function('"use strict";return ('+e+')')();
    if(typeof v!=="number"||!isFinite(v)) return {err:"Division par zéro, ou calcul impossible."};
    return {v};
  }catch(err){ return {err:"Expression incomplète."}; }
}
/* Les chiffres vivants de la boîte. Chacun devient une pastille à toucher. */
/* Raccourcit un énoncé en étiquette de puce : « Quelle est la marge brute ? »
   devient « marge brute ». Les questions suivent toutes le même moule. */
function exoLab(txt){
  let t=String(txt||"").replace(/\s*\?\s*$/,"").replace(/,\s*en\s*%.*$/i,"").replace(/\s*\([^)]*\)/g,"").trim();
  /* ⚠️ « Quelles? » ne matche PAS « Quel » (c'est « Quelle » + s facultatif) :
     la 1re version laissait « ✓ Quel est l'EBITDA » sur la puce.
     Et « les » doit passer AVANT « le » : une alternation est ordonnée, sinon
     « les capitaux engagés » devenait « s capitaux engagés ». */
  t=t.replace(/^Quel(?:le)?s?\s+(?:est|sont|vaut|valent)\s+/i,"")
     .replace(/^Combien\s+(?:d['’]|de\s+|des\s+)?\s*/i,"")
     .replace(/^(?:les|le|la|l['’]|des|du|de\s+la)\s*/i,"")
     .replace(/\s+faut-il\s+.*$/i,"")
     .trim();
  return t.length>24 ? t.slice(0,23)+"…" : t;
}
function calcVars(){
  /* ⚠️ DANS UN EXERCICE, LA CALCULATRICE PROPOSE LES CHIFFRES DE L'EXERCICE.
     Remonté le 2026-09-21 : sur un exercice de marge nette, les puces
     offraient « trésorerie · 83 795 », « prix · 270 », « EBITDA 12 mois ·
     139 714 » — la boîte de sa partie en cours, sans aucun rapport avec
     l'énoncé. Une suggestion hors sujet n'est pas neutre : elle invite à
     insérer le mauvais nombre.
     On sert donc les données de l'énoncé, PLUS les résultats qu'il vient
     d'établir dans le même exercice (la cascade se construit dessus :
     l'EBITDA se calcule à partir de la marge brute trouvée deux questions
     plus tôt). Hors exercice, rien ne change. */
  if(typeof EXS!=="undefined" && EXS && EXS.ex && EXS.ex[EXS.e]){
    const cur=EXS.ex[EXS.e];
    const out=(cur.donnees||[]).map(d=>[d[0], d[1]]);
    (EXS.acquis||[]).forEach(a=>out.push(["✓ "+a.lab, a.val]));
    return out;
  }
  const B=S.biz; if(!B) return [];
  const h=B.hist&&B.hist.length?B.hist[B.hist.length-1]:null;
  const eb12=eb12Of(B);
  const stock=Math.round((B.stockU||0)*(B.mc||0));
  const out=[
    ["trésorerie", Math.round(B.cash||0)],
    ["prix", B.price||0],
    ["coût unit.", B.mc||0],
    ["marge unit.", Math.round(((B.price||0)-(B.mc||0))*100)/100],
    ["charges fixes", Math.round(B.fc||0)]
  ];
  if(h){ out.push(["CA du mois", Math.round(h.ca||0)], ["EBITDA du mois", Math.round(ebM(h))]); if((h.dot||0)>0) out.push(["EBIT du mois (après dotations)", Math.round(ebitM(h))], ["Dotation du mois", Math.round(h.dot||0)]); }
  if(eb12) out.push(["EBITDA 12 mois", Math.round(eb12)]);
  if(B.ar) out.push(["créances", Math.round(B.ar)]);
  if(B.ap) out.push(["dettes fourn.", Math.round(B.ap)]);
  if(stock) out.push(["stock", stock]);
  if(B.ar||B.ap||stock) out.push(["BFR", Math.round(stock+(B.ar||0)-(B.ap||0))]);
  if(B.debt) out.push(["dette", Math.round(B.debt)]);
  return out;
}
function calcBlock(){
  const vars=calcVars();
  const pad=[["7"],["8"],["9"],["÷","op"],["4"],["5"],["6"],["×","op"],
             ["1"],["2"],["3"],["−","op"],["0"],[","],["%","op"],["+","op"],
             ["(","op"],[")","op"],["⌫","del"],["=","eq"]];
  return `<div class="calcw${S.calcOpen?" open":""}" id="calcw">
    <div class="calch" onclick="calcToggle()"><span>🧮</span><b>La calculatrice</b>
      <span class="xptxt">estime avant de trancher</span><span class="ar">›</span></div>
    <div class="calcb">
      <input class="calcin" id="calcin" inputmode="text" placeholder="3300 / (12 − 7,2)"
        oninput="calcLive()" onkeydown="if(event.key==='Enter'){event.preventDefault();calcEq();}">
      <div class="calcout" id="calcout"></div>
      <div class="calcpad">${pad.map(([t,c])=>
        `<button type="button" class="${c||""}" onclick="calcKey('${t==="'"?"":t}')">${t}</button>`).join("")}</div>
      ${vars.length?`<div class="xptxt" style="margin-top:11px">Tes chiffres — touche pour insérer :</div>
      <div class="calcvars">${vars.map(([n,v])=>
        `<button type="button" onclick="calcIns(${v})">${n} · ${calcFmt(v)}</button>`).join("")}</div>`:""}
      <div class="calcmem" id="calcmem"></div>
    </div></div>`;
}
function calcToggle(){
  const w=document.getElementById("calcw"); if(!w) return;
  w.classList.toggle("open"); S.calcOpen=w.classList.contains("open"); save();
  if(S.calcOpen){ const i=document.getElementById("calcin"); if(i) i.focus(); }

function calcLive(){
  const i=document.getElementById("calcin"), o=document.getElementById("calcout");
  if(!i||!o) return;
  const r=calcEval(i.value);
  if(r.v===null&&!r.err){ o.textContent=""; o.className="calcout"; return; }
  if(r.err){ o.textContent=r.err; o.className="calcout err"; return; }
  o.textContent="= "+calcFmt(r.v); o.className="calcout";
}
function calcKey(t){
  const i=document.getElementById("calcin"); if(!i) return;
  if(t==="⌫"){ i.value=i.value.slice(0,-1); calcLive(); i.focus(); return; }
  if(t==="="){ calcEq(); return; }
  i.value+=({"×":"*","÷":"/","−":"-"})[t]||t;
  calcLive(); i.focus();
}
function calcIns(v){
  const i=document.getElementById("calcin"); if(!i) return;
  /* on colle un opérateur implicite si le dernier caractère est un chiffre */
  if(/[0-9)%]$/.test(i.value.trim())) i.value+="*";
  /* virgule française comme le clavier : la saisie reste homogène à l'œil */
  i.value+=String(v).replace(".",","); calcLive(); i.focus();
}
function calcEq(){
  const i=document.getElementById("calcin"); if(!i) return;
  const r=calcEval(i.value);
  if(r.err||r.v===null) return calcLive();
  CALCMEM.unshift({e:i.value.trim(), v:r.v}); CALCMEM=CALCMEM.slice(0,3);
  calcMemDraw();
  i.value=String(Math.round(r.v*10000)/10000).replace(".",",");
  calcLive(); i.focus();
}
function calcMemDraw(){
  const m=document.getElementById("calcmem"); if(!m) return;
  m.innerHTML = CALCMEM.length
    ? "Mémoire — touche un résultat pour le réutiliser :<br>"+CALCMEM.map((x,k)=>
        `${x.e} = <span onclick="calcIns(${x.v})">${calcFmt(x.v)}</span>`).join("<br>")
    : "";
}


/* ---------- LE FORMULAIRE : les formules, calculables ----------
   « mets les formules quelque part, je ne les connais pas ». Son débriefing
   de la partie 1 l'a montré : sur 4 décisions coûteuses, un calcul de dix
   secondes donnait la réponse, il n'en a fait aucun — faute de connaître la
   formule. Une fiche = la question, la formule, des champs, un résultat EN
   DIRECT, et une LECTURE du résultat (une formule qu'on ne sait pas lire ne
   sert à rien). « Mes chiffres » la remplit avec l'état réel de sa boîte. */
let FORMCAT="Cash & BFR", FORMOPEN=null;
const FORMVALS={};
function formVals(f){
  if(!FORMVALS[f.id]){ FORMVALS[f.id]={}; f.champs.forEach(c=>FORMVALS[f.id][c.k]=c.v); }
  return FORMVALS[f.id];
}
/* remplissage depuis la boîte en cours — uniquement ce qui a un sens */
const FORM_PRE={
  bfr:       B=>({st:Math.round(B.stockU*B.mc), cr:Math.round(B.ar), df:Math.round(B.ap), ca:Math.round(formCA(B))}),
  /* le CA À CRÉDIT, pas le CA total : seules les ventes B2B créent des créances */
  dso:       B=>({cr:Math.round(B.ar), ca:Math.max(1,Math.round(formCA(B)*(B.b2bShare||1))), df:Math.round(B.ap), ach:Math.round(B.lastPurch||B.mc*B.qPrev||1)}),
  pointmort: B=>({p:Math.round(B.price*100)/100, cv:Math.round(B.mc*100)/100, cf:Math.round(B.fc)}),
  salarie:   B=>({net:1900, mu:Math.round((B.price-B.mc)*100)/100}),
  commande:  B=>({pp:Math.round(B.price*.6*100)/100, cv:Math.round(B.mc*100)/100, qte:500}),
  elast:     B=>({e:Math.round((B.elast||-1)*100)/100, dp:8}),
  prixopt:   B=>({pc:Math.round(curveChoke(B)*100)/100, cv:Math.round(B.mc*100)/100, p:Math.round(B.price*100)/100}),
  gearing:   B=>({d:Math.round(B.debt||0), tr:Math.round(Math.max(0,B.cash)), eb:Math.round(formEb12(B))}),
  multiple:  B=>({mult:6, eb:Math.round(formEb12(B)), d:Math.round(B.debt||0), tr:Math.round(Math.max(0,B.cash))}),
};
function formCA(B){ return (B.hist&&B.hist.length) ? B.hist[B.hist.length-1].ca : 1; }
function formEb12(B){ return eb12Of(B); }
function formPre(id){
  const B=S.biz; if(!B||!FORM_PRE[id]) return toast("Pas de partie en cours.");
  try{ Object.assign(formVals(FORMULES.find(f=>f.id===id)), FORM_PRE[id](B)); }catch(e){ return toast("Chiffres indisponibles."); }
  formDraw(); toast("Rempli avec tes chiffres.");
}
function formBlock(){
  return `<div class="calcw${S.formOpen?" open":""}" id="formw">
    <div class="calch" onclick="formToggle()"><span>📐</span><b>Les formules</b>
      <span class="xptxt">tu ne calcules pas de tête</span><span class="ar">›</span></div>
    <div class="calcb"><div id="formbody"></div></div></div>`;
}
function formToggle(){
  const w=document.getElementById("formw"); if(!w) return;
  w.classList.toggle("open"); S.formOpen=w.classList.contains("open"); save();
  if(S.formOpen) formDraw();
}
function formDraw(){
  const host=document.getElementById("formbody"); if(!host) return;
  const list=FORMULES.filter(f=>f.cat===FORMCAT);
  host.innerHTML=`<div class="fmcats">${FORM_CATS.map(c=>
      `<button class="${c===FORMCAT?"on":""}" onclick="FORMCAT='${c.replace(/'/g,"\\'")}';FORMOPEN=null;formDraw()">${c}</button>`).join("")}</div>
    ${list.map(f=>{
      const v=formVals(f), open=FORMOPEN===f.id;
      let res=null; try{ res=f.calc(v); }catch(e){}
      return `<div class="fmc${open?" open":""}">
        <div class="fmh" onclick="FORMOPEN=${open?"null":"'"+f.id+"'"};formDraw()">
          <span class="i">${f.ic}</span><b>${f.t}</b><span class="ar">${open?"▾":"›"}</span></div>
        <div class="fmb">
          <div class="fmq">${f.q}</div>
          <div class="fmf">${f.f}</div>
          <div class="fmin">${f.champs.map(c=>
            `<label>${c.lab}</label><input type="number" step="${c.pas||1}" value="${v[c.k]}"
              oninput="formSet('${f.id}','${c.k}',this.value)">`).join("")}</div>
          <div class="fmr"><span class="v">${res==null?"—":fmtNum(res)+" "+f.unite}</span>${
            (()=>{ try{ return f.lire(res,v); }catch(e){ return "—"; } })()}</div>
          <div class="fmacts">
            ${FORM_PRE[f.id]&&S.biz?`<button onclick="formPre('${f.id}')">📥 Mes chiffres</button>`:""}
            ${res!=null?`<button onclick="formToCalc(${res})">🧮 Vers la calculatrice</button>`:""}
          </div>
          <div class="fmn">💡 ${f.note}</div>
          <div class="fmp"><b>Le piège :</b> ${f.piege}</div>
        </div></div>`;

}
function fmtNum(v){
  if(!isFinite(v)) return "—";
  return Math.abs(v)>=1000 ? Math.round(v).toLocaleString("fr-FR")
       : (Math.round(v*100)/100).toLocaleString("fr-FR",{maximumFractionDigits:2});
}
function formSet(id,k,val){
  const f=FORMULES.find(x=>x.id===id); const v=formVals(f);
  const n=parseFloat(String(val).replace(",","."));
  v[k]=isFinite(n)?n:0;
  /* on ne redessine que la ligne de résultat : sinon le champ perd le focus */
  const card=[...document.querySelectorAll(".fmc")].find(c=>c.querySelector(".fmh b")&&c.querySelector(".fmh b").textContent===f.t);
  if(!card) return;
  let res=null; try{ res=f.calc(v); }catch(e){}
  const r=card.querySelector(".fmr");
  if(r) r.innerHTML=`<span class="v">${res==null?"—":fmtNum(res)+" "+f.unite}</span>`+
    (()=>{ try{ return f.lire(res,v); }catch(e){ return "—"; } })();
}
function formToCalc(v){
  const w=document.getElementById("calcw");
  if(w && !w.classList.contains("open")) calcToggle();
  calcIns(Math.round(v*10000)/10000);
  toast("Résultat envoyé à la calculatrice.");
}

function argMin(){ return S.biz && S.biz.level===1 ? 90 : 200; }
/* Quel cas de négociation est ouvert — null pour un cas normal ou un prêt.
   Sans ça, le verrou ne pouvait pas savoir qu'il devait AUSSI exiger des
   arguments cochés. */
let NEGOACTIVE=null;
function bzArgLen(){ const t=document.getElementById("bzArg"); return t?t.value.trim().length:0; }
/* Le verrou unique de tous les cas. Il regardait uniquement la longueur du
   texte : en négociation, le bouton « Négocier » s'allumait donc alors
   qu'aucun levier n'était coché, et l'app ne le disait qu'APRÈS le clic,
   par un toast fugace. Le verrou dit maintenant ce qui manque, avant. */
function bzArgSync(){
  const need=argMin(), len=bzArgLen();
  const okLen=len>=need;
  const okPicks=!NEGOACTIVE || NEGOPICK.length>0;
  document.querySelectorAll(".bzOpt").forEach(b=>b.disabled=!(okLen&&okPicks));
  const cnt=document.getElementById("ngCount");
  if(cnt && NEGOACTIVE){
    const c=bizCase(NEGOACTIVE), n=NEGOPICK.length;
    cnt.innerHTML = n
      ? `<b style="color:var(--acc)">${n}/${c.max}</b> argument${n>1?"s":""} retenu${n>1?"s":""} — touche une ligne pour la décocher`
      : `<b style="color:var(--acc)">0/${c.max}</b> — <b>touche les arguments ci-dessus pour les retenir</b>. Les écrire dans la zone de texte ne les joue pas.`;
  }
  const g=document.getElementById("bzGate");
  if(g){
    const manque=[];
    if(!okPicks) manque.push("<b>coche au moins un argument</b> dans la liste au-dessus");
    if(!okLen) manque.push(`encore <b>${need-len}</b> caractère${need-len>1?"s":""}`);
    g.innerHTML = manque.length ? "Il manque : "+manque.join(" · ") : "✓ Prêt — et ta justification doit contenir un <b>chiffre</b>.";
    g.className = "xptxt "+(manque.length?"gateko":"gateok");
  }
}

function bizTakeLoan(cid,k){
